openapi: 3.1.0
info:
  title: Backend API
  version: 1.0.0
  description: |
    API contract for authentication and Redis-backed HTTP sessions.

    CSRF protection is enabled. Every unsafe request (POST, PUT, PATCH, DELETE)
    must echo the value of the `XSRF-TOKEN` cookie in the `X-XSRF-TOKEN` header,
    or the request is rejected with 403 before authentication is considered. The
    cookie is readable by JavaScript and is issued on any response from the API,
    including anonymous ones. Login and logout both replace it, so the value has
    to be read at request time rather than cached.

    The service serves two separate security chains. The session-authenticated
    application API under `/api` uses the cookie and CSRF rules above. The SCIM v2
    interface under `/scim/v2` is stateless and authenticated per request by an
    opaque connector bearer token, with no session, no CSRF and no cookie: a
    connector token buys nothing under `/api`, and a session buys nothing under
    `/scim/v2`. The operations under the Connectors tag are how an administrator
    mints and retires the credentials that chain accepts.

    **The SCIM namespace is behind a release gate that is off by default.** While
    `APP_SCIM_ENABLED` is unset or false every path below `/scim/v2` answers `404`
    with a SCIM error document — discovery included, and ahead of authentication.
    Every SCIM operation documented here therefore also has a `404` that means "not
    served by this deployment" rather than "no such resource"; it is not repeated on
    each operation.

    SCIM requests and responses use `application/scim+json`; `application/json` is
    accepted and understood, and a response defaults to `application/scim+json`.
    SCIM errors are documents of their own shape (`ScimError`) and never the
    application chain's error shape.
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Authentication
  - name: Session
  - name: Counter
  - name: Administration
  - name: Connectors
  - name: SCIM
  - name: Health
paths:
  /api/auth/login:
    post:
      tags: [Authentication]
      summary: Log in
      description: |
        Authenticates database-backed credentials, stores the authenticated user
        in the HTTP session, and returns the account role. A successful login also
        ends the account's run of failed attempts, resetting its counter to zero.
      operationId: login
      security: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authentication succeeded.
          headers:
            Set-Cookie:
              description: |
                The session cookie, and a replacement `XSRF-TOKEN` cookie. The
                session cookie can be omitted when an existing session is reused;
                the CSRF token is always replaced, because a token obtained before
                authentication does not remain valid after it.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: The request body is missing, malformed, or fails validation.
        "401":
          description: |
            The login was refused. One response covers every reason — unknown
            username, wrong password, and an account locked after too many
            consecutive failures — and carries no body, so it cannot be used to
            learn whether an account exists or whether it is locked. Consecutive
            refusals lock the account for a configured window; while it holds, the
            correct password is refused too.
        "403":
          $ref: "#/components/responses/CsrfTokenRejected"
  /api/auth/me:
    get:
      tags: [Authentication]
      summary: Get the authenticated user
      operationId: getCurrentUser
      responses:
        "200":
          description: The authenticated user and role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/auth/logout:
    delete:
      tags: [Authentication]
      summary: Log out
      description: Invalidates the current HTTP session and clears the security context.
      operationId: logout
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Logout completed.
          headers:
            Set-Cookie:
              description: |
                An expired session cookie, so the browser stops sending an id that
                names nothing, and a replacement `XSRF-TOKEN` cookie usable for the
                next login.
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CsrfTokenRejected"
  /api/session:
    get:
      tags: [Session]
      summary: Get session state
      operationId: getSession
      responses:
        "200":
          description: Current session state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [Session]
      summary: Update session state
      operationId: updateSession
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSessionRequest"
      responses:
        "200":
          description: Updated session state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          description: The request body is missing, malformed, or fails validation.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CsrfTokenRejected"
    delete:
      tags: [Session]
      summary: Delete the current session
      operationId: deleteSession
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: The session was invalidated.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CsrfTokenRejected"
  /api/count:
    get:
      tags: [Counter]
      summary: Get the authenticated user's count
      operationId: getCount
      responses:
        "200":
          description: The current count, or zero if the user has not incremented it yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/count/increment:
    post:
      tags: [Counter]
      summary: Increment the authenticated user's count
      operationId: incrementCount
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: The incremented count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CsrfTokenRejected"
  /api/count/reset:
    post:
      tags: [Counter]
      summary: Reset the authenticated user's count
      operationId: resetCount
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: The reset count, which is zero.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CsrfTokenRejected"
  /api/admin/accounts:
    get:
      tags: [Administration]
      summary: List every registered account
      description: |
        Administrative review of who has access. Requires `ROLE_ADMIN`: an
        authenticated account with any other role is refused with 403, and the
        403 is decided by the filter chain before this operation runs.

        The response never contains a password hash. It is serialised from a
        projection that has no field for one, so the guarantee is structural
        rather than a matter of review discipline.
      operationId: listAccounts
      responses:
        "200":
          description: Every account, ordered by username.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccountSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRoleRequired"
  /api/admin/accounts/{username}/disable:
    post:
      tags: [Administration]
      summary: Close an account to logins
      description: |
        Sets the account's `enabled` flag to false. A disabled account is refused
        at login with the same bare `401` as a wrong password.

        Leaves the lockout untouched: this is not a penalty, and it says nothing
        about the account's failure run. Idempotent — disabling an already
        disabled account writes nothing, still revokes its sessions, and answers
        200.

        Every session the account already holds is REVOKED. Its next request
        arrives unauthenticated and earns a `401`, rather than working on until
        the session expires. A refused disable (`409`) revokes nothing.
      operationId: disableUser
      parameters:
        - $ref: "#/components/parameters/Username"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          $ref: "#/components/responses/AdminAccount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRoleRequired"
        "404":
          $ref: "#/components/responses/UnknownAccount"
        "409":
          $ref: "#/components/responses/UnsafeAccountChange"
  /api/admin/accounts/{username}/enable:
    post:
      tags: [Administration]
      summary: Reopen an account to logins
      description: |
        Sets `enabled` back to true. Does NOT lift a lockout the account is
        serving — that is a separate capability, `unlock`. Idempotent.

        Does not restore sessions `disable` revoked either: the account signs in
        again.
      operationId: enableUser
      parameters:
        - $ref: "#/components/parameters/Username"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          $ref: "#/components/responses/AdminAccount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRoleRequired"
        "404":
          $ref: "#/components/responses/UnknownAccount"
  /api/admin/accounts/{username}/unlock:
    post:
      tags: [Administration]
      summary: End a lockout early
      description: |
        Clears the failure run and the recorded `locked_until`, so a lockout ends
        before its window expires. Says nothing about `enabled`: a disabled
        account can be unlocked and stays disabled.

        Idempotent — an account serving no lockout is answered 200 with nothing
        written.
      operationId: unlockUser
      parameters:
        - $ref: "#/components/parameters/Username"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          $ref: "#/components/responses/AdminAccount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRoleRequired"
        "404":
          $ref: "#/components/responses/UnknownAccount"
  /api/admin/connectors:
    get:
      tags: [Connectors]
      summary: List SCIM connectors and the state of their tokens
      description: |
        Every live connector, alphabetically, each with every token it has ever
        held (newest issue first). A deleted connector is omitted.

        The response never contains a token value or its hash. It is serialised
        from a projection that has no field for either, so the guarantee is
        structural rather than a matter of review discipline — the same
        arrangement `AccountSummary` uses for the password hash.

        `active` is the server's own evaluation at the moment it answers, not a
        comparison the client makes against its own clock.
      operationId: listConnectors
      responses:
        "200":
          description: Every live connector.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConnectorSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRoleRequired"
    post:
      tags: [Connectors]
      summary: Create a SCIM connector
      description: |
        Creates a connector holding no tokens. `displayName` is the
        administrator's own label and carries no authority: scope is a property of
        each token, not of the connector.
      operationId: createConnector
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "201":
          description: The connector as created, holding no tokens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorSummary"
        "400":
          description: The display name is missing or longer than 200 characters.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRoleRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConnectorRequest"
  /api/admin/connectors/{connectorId}:
    delete:
      tags: [Connectors]
      summary: Delete a SCIM connector
      description: |
        Revokes every token the connector holds and deletes every one of its
        connector-scoped `externalId` aliases, in ONE transaction. Users and
        Groups are untouched — an alias is a connector's name for a resource, not
        the resource.

        One transaction is the requirement rather than an optimisation: aliases
        gone with tokens still live would leave a credential able to write to a
        directory it can no longer address its own resources in, and the reverse
        would leave a namespace reserved by nobody.

        The connector row survives with a deletion timestamp, so an audit event
        that names it still resolves a year later. It stops being listed and stops
        authenticating immediately, and its `externalId` namespace becomes
        available to a future connector.

        Not idempotent: deleting an already-deleted connector is 404, because an
        administrator repeating a delete is likelier to have the wrong id than to
        want a second no-op.
      operationId: deleteConnector
      parameters:
        - $ref: "#/components/parameters/ConnectorId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: The connector, its tokens and its aliases are gone.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRoleRequired"
        "404":
          $ref: "#/components/responses/UnknownConnector"
  /api/admin/connectors/{connectorId}/tokens:
    post:
      tags: [Connectors]
      summary: Issue a connector token
      description: |
        Mints a token and returns its plaintext. **This is the only time that value
        exists.** What is stored is a SHA-256 digest of it, so there is no
        operation that returns it again and no support path that can recover it —
        a lost token is rotated, not retrieved.

        The response carries `Cache-Control: no-store`, so the credential is not
        written to a shared cache on its way to the browser.

        `lifetimeDays` defaults to 365 and may not exceed it. A longer request is
        400 rather than a silently shortened token, so an administrator never
        walks away believing their integration has longer than it does.
      operationId: issueConnectorToken
      parameters:
        - $ref: "#/components/parameters/ConnectorId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "201":
          $ref: "#/components/responses/IssuedConnectorToken"
        "400":
          description: |
            `scope` is missing, or `lifetimeDays` is not positive or exceeds 365.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRoleRequired"
        "404":
          $ref: "#/components/responses/UnknownConnector"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueTokenRequest"
  /api/admin/connectors/{connectorId}/tokens/{tokenId}/rotate:
    post:
      tags: [Connectors]
      summary: Replace a connector token, with a bounded overlap
      description: |
        Mints a replacement of the same scope with a fresh full lifetime, and
        brings the OLD token's expiry forward to the end of the overlap window so
        an integration can be redeployed before its current credential stops
        working.

        The overlap ends at the EARLIER of the requested window and the expiry the
        old token already had, capped at 14 days. Three consequences worth
        stating: a request longer than 14 days is clamped rather than refused; an
        overlap longer than the token had left ends at the token's own expiry, so
        rotation can never lengthen a token's life; and a second rotation cannot
        undo the first one's shortening. `overlapDays` absent or zero ends the old
        token at this instant.

        The response discloses the replacement's plaintext once, under
        `Cache-Control: no-store`, exactly as issue does.
      operationId: rotateConnectorToken
      parameters:
        - $ref: "#/components/parameters/ConnectorId"
        - $ref: "#/components/parameters/TokenId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "201":
          $ref: "#/components/responses/IssuedConnectorToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRoleRequired"
        "404":
          $ref: "#/components/responses/UnknownConnector"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RotateTokenRequest"
  /api/admin/connectors/{connectorId}/tokens/{tokenId}/revoke:
    post:
      tags: [Connectors]
      summary: Revoke a connector token
      description: |
        Effective immediately: the next SCIM request presenting it is refused with
        `401` and `WWW-Authenticate: Bearer error="invalid_token"`, the same answer
        a token that never existed gets.

        Idempotent — a token already revoked keeps its original revocation time
        and nothing is written, though the attempt is still audited.
      operationId: revokeConnectorToken
      parameters:
        - $ref: "#/components/parameters/ConnectorId"
        - $ref: "#/components/parameters/TokenId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: The token is no longer accepted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRoleRequired"
        "404":
          $ref: "#/components/responses/UnknownConnector"
  /scim/v2/ServiceProviderConfig:
    get:
      tags: [SCIM]
      summary: Read the SCIM capabilities of this deployment
      description: |
        Public: a connector reads this before it holds a credential. The document
        describes what this deployment implements, not SCIM in general — `patch`,
        `filter` and `sort` are advertised unsupported while their tickets are
        outstanding, `bulk` is unsupported permanently with zero limits, and `etag`
        is supported. A `filter` parameter is refused rather than ignored, because an
        ignored filter is indistinguishable from a match.
      operationId: getScimServiceProviderConfig
      security: []
      responses:
        "200":
          description: The capability document.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimServiceProviderConfig"
        "403":
          $ref: "#/components/responses/ScimUnsupportedQuery"
  /scim/v2/ResourceTypes:
    get:
      tags: [SCIM]
      summary: List the SCIM resource types served
      description: |
        Public. User alone: a resource type in this list is a claim that its endpoint
        answers, and `/Groups` does not yet.
      operationId: listScimResourceTypes
      security: []
      responses:
        "200":
          description: A ListResponse of resource-type documents.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimListResponse"
        "403":
          $ref: "#/components/responses/ScimUnsupportedQuery"
  /scim/v2/ResourceTypes/{resourceType}:
    get:
      tags: [SCIM]
      summary: Read one SCIM resource type
      operationId: getScimResourceType
      security: []
      parameters:
        - name: resourceType
          in: path
          required: true
          description: The resource type's id, e.g. `User`.
          schema:
            type: string
      responses:
        "200":
          description: The resource-type document.
          content:
            application/scim+json:
              schema:
                type: object
        "403":
          $ref: "#/components/responses/ScimUnsupportedQuery"
        "404":
          $ref: "#/components/responses/ScimNotFound"
  /scim/v2/Schemas:
    get:
      tags: [SCIM]
      summary: List the SCIM schemas served
      description: |
        Public. The core User schema alone, listing exactly the attributes this
        service stores — no unimplemented core attribute and no extension. `password`
        is declared `mutability: writeOnly` and `returned: never`.
      operationId: listScimSchemas
      security: []
      responses:
        "200":
          description: A ListResponse of schema documents.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimListResponse"
        "403":
          $ref: "#/components/responses/ScimUnsupportedQuery"
  /scim/v2/Schemas/{schemaUri}:
    get:
      tags: [SCIM]
      summary: Read one SCIM schema
      operationId: getScimSchema
      security: []
      parameters:
        - name: schemaUri
          in: path
          required: true
          description: |
            The schema's URI, compared exactly — case-sensitive, because it is an
            identifier. e.g. `urn:ietf:params:scim:schemas:core:2.0:User`.
          schema:
            type: string
      responses:
        "200":
          description: The schema document.
          content:
            application/scim+json:
              schema:
                type: object
        "403":
          $ref: "#/components/responses/ScimUnsupportedQuery"
        "404":
          $ref: "#/components/responses/ScimNotFound"
  /scim/v2/Users:
    get:
      tags: [SCIM]
      summary: Retrieve a page of Users
      description: |
        A bulk read, audited as one event whatever the page size and whatever comes
        back. `startIndex` is one-based and defaults to 1; `count` defaults to 100
        and is capped at 200; `count=0` returns no `Resources` but still reports
        `totalResults`. `filter`, `sortBy` and `sortOrder` are refused with `403`
        while unimplemented, matching what ServiceProviderConfig advertises.
      operationId: listScimUsers
      security:
        - connectorBearer: []
      parameters:
        - $ref: "#/components/parameters/ScimStartIndex"
        - $ref: "#/components/parameters/ScimCount"
        - $ref: "#/components/parameters/ScimAttributes"
        - $ref: "#/components/parameters/ScimExcludedAttributes"
      responses:
        "200":
          description: A ListResponse of User resources.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimListResponse"
        "400":
          $ref: "#/components/responses/ScimBadRequest"
        "401":
          $ref: "#/components/responses/ScimUnauthenticated"
        "403":
          $ref: "#/components/responses/ScimUnsupportedQuery"
    post:
      tags: [SCIM]
      summary: Create a User
      description: |
        Requires a read-write token; a read-only one is refused with `403` and
        `WWW-Authenticate: Bearer error="insufficient_scope"` before any handler runs.

        `password` is optional — a credentialless User is a supported state and
        cannot authenticate until a password is set. A supplied password is hashed
        before the resource is persisted and appears in no response, no log and no
        audit event. Read-only attributes in the body (`id`, `meta`, `groups`) are
        ignored, as RFC 7644 requires, so a client may round-trip a resource it read;
        an attribute this service does not implement is refused with
        `400 invalidValue` rather than dropped. `active` defaults to true.

        `externalId` is scoped to the calling connector: two connectors hold
        independent aliases for one User and each sees only its own.
      operationId: createScimUser
      security:
        - connectorBearer: []
      parameters:
        - $ref: "#/components/parameters/ScimAttributes"
        - $ref: "#/components/parameters/ScimExcludedAttributes"
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: "#/components/schemas/ScimUser"
          application/json:
            schema:
              $ref: "#/components/schemas/ScimUser"
      responses:
        "201":
          description: |
            The canonical resource. `Location` names it and `ETag` is its strong
            validator, the same string as `meta.version`.
          headers:
            Location:
              description: Absolute URI of the created User.
              schema:
                type: string
            ETag:
              description: Strong validator, e.g. `"1"`.
              schema:
                type: string
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimUser"
        "400":
          $ref: "#/components/responses/ScimBadRequest"
        "401":
          $ref: "#/components/responses/ScimUnauthenticated"
        "403":
          description: |
            The token is read-only. Carries `WWW-Authenticate: Bearer
            error="insufficient_scope"` and no body — the refusal is about the
            credential's scope, which RFC 6750 states in the challenge.
        "409":
          description: A live User already holds that userName, case-insensitively.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
  /scim/v2/Users/{id}:
    get:
      tags: [SCIM]
      summary: Retrieve one User
      description: |
        Not audited: a single-resource read is the ordinary unit of provisioning
        traffic, and recording it would bury the collection reads that indicate an
        enumeration. An id that is not a UUID is a `404` like any other unknown id.
      operationId: getScimUser
      security:
        - connectorBearer: []
      parameters:
        - name: id
          in: path
          required: true
          description: The resource's stable SCIM id.
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/ScimAttributes"
        - $ref: "#/components/parameters/ScimExcludedAttributes"
      responses:
        "200":
          description: The canonical resource.
          headers:
            ETag:
              description: Strong validator, the same string as `meta.version`.
              schema:
                type: string
            Location:
              description: Absolute URI of this User.
              schema:
                type: string
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimUser"
        "400":
          $ref: "#/components/responses/ScimBadRequest"
        "401":
          $ref: "#/components/responses/ScimUnauthenticated"
        "404":
          $ref: "#/components/responses/ScimNotFound"
  /actuator/health:
    get:
      tags: [Health]
      summary: Get application health
      operationId: getHealth
      security: []
      responses:
        "200":
          description: The application is healthy.
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: The application is unhealthy.
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
security:
  - sessionCookie: []
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: HTTP session created by a successful login.
    connectorBearer:
      type: http
      scheme: bearer
      description: |
        An opaque connector token issued by an administrator of this deployment,
        presented as `Authorization: Bearer <value>` on every SCIM resource request.
        Accepted in that header and nowhere else — never from a query string, a form
        body or a cookie. There is no authorization server and no grant flow.
  parameters:
    ScimStartIndex:
      name: startIndex
      in: query
      required: false
      description: |
        One-based index of the first resource to return. Defaults to 1; anything below
        1 is coerced to 1 rather than refused, as RFC 7644 asks.
      schema:
        type: integer
    ScimCount:
      name: count
      in: query
      required: false
      description: |
        Page size. Defaults to 100 and is capped at 200; a negative value becomes 0,
        and 0 returns no `Resources` while still reporting `totalResults`.
      schema:
        type: integer
    ScimAttributes:
      name: attributes
      in: query
      required: false
      description: |
        Comma-separated attribute paths to return, beside the always-returned
        `schemas` and `id`. Mutually exclusive with `excludedAttributes`. Names are
        case-insensitive and may be schema-qualified; a sub-attribute path such as
        `name.givenName` narrows a complex value. A path this service does not
        implement is `400 invalidValue`. `password` is declared `returned: never`, so
        requesting it yields a resource without it rather than an error.
      schema:
        type: string
    ScimExcludedAttributes:
      name: excludedAttributes
      in: query
      required: false
      description: |
        Comma-separated attribute paths to omit. Mutually exclusive with `attributes`;
        an always-returned attribute survives being named here.
      schema:
        type: string
    Username:
      name: username
      in: path
      required: true
      description: The account to act on.
      schema:
        type: string
    CsrfToken:
      name: X-XSRF-TOKEN
      in: header
      required: true
      description: The current value of the XSRF-TOKEN cookie, echoed back unchanged.
      schema:
        type: string
    ConnectorId:
      name: connectorId
      in: path
      required: true
      description: The connector's stable id.
      schema:
        type: string
        format: uuid
    TokenId:
      name: tokenId
      in: path
      required: true
      description: |
        The token's stable id, as the listing reports it. Not the token value — the
        value is never sent to this service in a URL.
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: A valid authenticated session is required.
    CsrfTokenRejected:
      description: |
        The CSRF token is missing or does not match the XSRF-TOKEN cookie. This is
        decided before authentication, so it is returned even on the public login
        operation.
    AdminAccount:
      description: The account as it stands after the change.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AccountSummary"
    UnknownAccount:
      description: |
        No account has that username. The body is empty; the caller is already an
        administrator, so this reveals nothing the listing would not.
    UnsafeAccountChange:
      description: |
        The action would leave nobody able to reverse it — an account disabling
        itself, or the last enabled administrator. Not 403: the caller holds the
        right role, the action itself is refused.
    UnknownConnector:
      description: |
        No live connector or token has that id. The body is empty, and "never
        existed" and "already deleted" are the same answer: the caller is an
        administrator who can read either from the listing.
    IssuedConnectorToken:
      description: |
        The token, including its plaintext — the only time that value is disclosed.
        Sent with `Cache-Control: no-store`.
      headers:
        Cache-Control:
          description: Always `no-store`; a credential may not be cached.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IssuedConnectorToken"
    AdminRoleRequired:
      description: |
        The session is valid and was accepted; the account's role is what was
        refused. Distinct from 401, which means no usable session arrived at all —
        a client must not treat this as a signal to sign in again.
    ScimBadRequest:
      description: |
        The request was not acceptable SCIM: an unparseable or non-object body, a
        schema other than this service's one User schema, a missing required
        attribute, an attribute or sub-attribute this service does not implement, a
        value of the wrong JSON type, or a projection naming something that is not an
        attribute. `scimType` is `invalidSyntax` or `invalidValue`.
      content:
        application/scim+json:
          schema:
            $ref: "#/components/schemas/ScimError"
    ScimUnauthenticated:
      description: |
        No bearer token, or one that is malformed, unknown, expired, revoked or whose
        connector was deleted. `WWW-Authenticate` is a bare `Bearer` when no
        credential was presented and `Bearer error="invalid_token"` when one was; the
        several reasons are not told apart, because telling them apart reports whether
        a credential ever existed. No body.
    ScimUnsupportedQuery:
      description: |
        The request asked for a query capability this service does not implement —
        filtering or sorting, or a filter on a discovery path. `403` rather than a
        silently ignored parameter, which RFC 7644 §3.4.2.2 permits and which is the
        only answer a client cannot mistake for a match. No `scimType`.
      content:
        application/scim+json:
          schema:
            $ref: "#/components/schemas/ScimError"
    ScimNotFound:
      description: |
        No live resource, schema or resource type has that identifier.
      content:
        application/scim+json:
          schema:
            $ref: "#/components/schemas/ScimError"
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          pattern: ".*\\S.*"
        password:
          type: string
          minLength: 1
          pattern: ".*\\S.*"
          format: password
    UserResponse:
      type: object
      required: [username, role]
      properties:
        username:
          type: string
        role:
          type: string
          enum: [USER, ADMIN]
          description: The account role used for authorization.
    AccountSummary:
      type: object
      required: [username, role, enabled, locked, lockedUntil, createdAt]
      properties:
        username:
          type: string
        role:
          type: string
          enum: [USER, ADMIN]
        enabled:
          type: boolean
          description: |
            Administrative standing. Not decorative: a disabled account is refused
            at login. Changed only through the disable and enable operations.
        locked:
          type: boolean
          description: |
            Whether a lockout is in force, as the server evaluated it when
            answering. Independent of `enabled` — a lockout is an automatic,
            expiring penalty for failed logins. A client must not recompute this
            by comparing `lockedUntil` to its own clock: only the server's clock
            is the one the login path enforces on.
        lockedUntil:
          type: [string, "null"]
          format: date-time
          description: |
            When the current lockout lifts. Null if none was ever imposed, and
            kept after one expires, so a non-null value does not mean locked.
        createdAt:
          type: [string, "null"]
          format: date-time
          description: |
            Null only for an account row written before this column existed.
            Startup seeding backfills it, so a deployment reports null at most
            until its next restart.
    UpdateSessionRequest:
      type: object
      required: [displayName]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ".*\\S.*"
    SessionResponse:
      type: object
      required: [id, createdAt, maxInactiveIntervalSeconds]
      properties:
        id:
          type: string
        displayName:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        maxInactiveIntervalSeconds:
          type: integer
          format: int32
    CountResponse:
      type: object
      required: [count]
      properties:
        count:
          type: integer
          format: int64
          minimum: 0
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
      additionalProperties: true
    ConnectorTokenScope:
      type: string
      enum: [READ_ONLY, READ_WRITE]
      description: |
        Directory-wide. `READ_WRITE` implies read, so there is no scope that can
        mutate a resource it cannot retrieve. Enforced in the SCIM chain's filter
        from the method and path alone, not by a check inside a handler.
    CreateConnectorRequest:
      type: object
      required: [displayName]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 200
          description: The administrator's own label. Carries no authority.
    IssueTokenRequest:
      type: object
      required: [scope]
      properties:
        scope:
          $ref: "#/components/schemas/ConnectorTokenScope"
        lifetimeDays:
          type: [integer, "null"]
          format: int32
          minimum: 1
          maximum: 365
          description: Defaults to 365, which is also the hard maximum.
    RotateTokenRequest:
      type: object
      properties:
        overlapDays:
          type: [integer, "null"]
          format: int32
          description: |
            How long the old token keeps working. Clamped to 14 days and to the life
            the old token had left; absent or zero ends it immediately.
    ConnectorTokenSummary:
      type: object
      required: [id, scope, issuedAt, expiresAt, originalExpiresAt, active]
      description: |
        Has no property a token value or its hash could occupy, and that is
        deliberate: the serialised projection has no such field, so a listing cannot
        disclose a credential even by mistake.
      properties:
        id:
          type: string
          format: uuid
        scope:
          $ref: "#/components/schemas/ConnectorTokenScope"
        issuedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: As it currently stands; a rotation may have brought it forward.
        originalExpiresAt:
          type: string
          format: date-time
          description: |
            The expiry it was issued with, so a shortened overlap window is visible
            as one. Never earlier than `expiresAt`.
        revokedAt:
          type: [string, "null"]
          format: date-time
        active:
          type: boolean
          description: |
            Whether the token would be accepted right now — the server's own
            evaluation, not a comparison the client makes against its own clock.
    ConnectorSummary:
      type: object
      required: [id, displayName, createdAt, tokens]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        createdAt:
          type: string
          format: date-time
        tokens:
          type: array
          description: Every token the connector has held, newest issue first.
          items:
            $ref: "#/components/schemas/ConnectorTokenSummary"
    IssuedConnectorToken:
      type: object
      required: [connectorId, tokenId, scope, issuedAt, expiresAt, presentedValue]
      description: |
        The only schema that carries a token value, returned only by issue and
        rotate. A type of its own rather than a nullable field on
        `ConnectorTokenSummary`, so the shape a listing uses has no property for a
        credential at all.
      properties:
        connectorId:
          type: string
          format: uuid
        tokenId:
          type: string
          format: uuid
        scope:
          $ref: "#/components/schemas/ConnectorTokenScope"
        issuedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        presentedValue:
          type: string
          description: |
            The complete opaque bearer value, sent to the SCIM interface as
            `Authorization: Bearer <value>`. Store it now — this service holds only
            a digest and cannot show it again.
    ScimError:
      type: object
      required: [schemas, status, detail]
      description: |
        The one shape every SCIM refusal from this namespace takes. `status` is a
        STRING, as RFC 7644 §3.12 defines it. `scimType` is present only where the RFC
        defines one for the condition, and is omitted rather than null where it does
        not. `detail` is written by this service and never echoes a submitted value —
        an attribute path, yes; a userName or a password, never.
      properties:
        schemas:
          type: array
          items:
            type: string
          example: ["urn:ietf:params:scim:api:messages:2.0:Error"]
        status:
          type: string
          example: "409"
        scimType:
          type: string
          enum: [invalidSyntax, invalidValue, invalidFilter, uniqueness]
        detail:
          type: string
    ScimMeta:
      type: object
      description: |
        Server-owned metadata. Timestamps are UTC with a `Z` offset, as RFC 7643's
        conventions lead a connector to expect; the service's log timestamps use a
        different zone and the two are not reconciled.
      properties:
        resourceType:
          type: string
          example: User
        created:
          type: string
          format: date-time
        lastModified:
          type: string
          format: date-time
        location:
          type: string
        version:
          type: string
          description: |
            The resource's strong validator, quotes included — the same string as the
            `ETag` header, so a client can compare the two without unwrapping either.
          example: "\"1\""
    ScimUserName:
      type: object
      description: |
        The `name` complex attribute. Every sub-attribute is optional, and the
        attribute is omitted entirely when all of them are absent — SCIM omits an
        unassigned attribute rather than rendering an empty object.
      properties:
        formatted:
          type: string
        familyName:
          type: string
        givenName:
          type: string
        middleName:
          type: string
        honorificPrefix:
          type: string
        honorificSuffix:
          type: string
    ScimUserEmail:
      type: object
      required: [value]
      description: |
        One value of the multi-valued `emails` attribute. `(type, value)` duplicates
        are removed before storage and at most one value may be primary — a second
        claim is demoted rather than refused. `primary` is rendered only when true.
      properties:
        value:
          type: string
        type:
          type: string
          example: work
        primary:
          type: boolean
    ScimUser:
      type: object
      required: [schemas, userName]
      description: |
        A SCIM core User, as this service implements it. Unimplemented core attributes
        and every extension are absent from `/Schemas` and refused when asserted on a
        write.

        On a write: `id`, `meta` and `groups` are ignored if present, `password` is
        write-only and never returned, and `externalId` is scoped to the calling
        connector. On a read: `password` is never present, and an unassigned attribute
        is omitted rather than rendered null.
      properties:
        schemas:
          type: array
          items:
            type: string
          example: ["urn:ietf:params:scim:schemas:core:2.0:User"]
        id:
          type: string
          format: uuid
          description: Server-assigned, stable, and unique across Users and Groups.
          readOnly: true
        externalId:
          type: string
          description: The calling connector's alias for this resource, case-exact.
        userName:
          type: string
          description: |
            Unique among live Users, case-insensitively, after Unicode NFKC and case
            folding. Mutable, and reusable once its User is deleted.
        name:
          $ref: "#/components/schemas/ScimUserName"
        displayName:
          type: string
        preferredLanguage:
          type: string
        locale:
          type: string
        timezone:
          type: string
        active:
          type: boolean
          description: Defaults to true on create. An inactive User cannot log in.
        password:
          type: string
          writeOnly: true
          description: |
            Hashed with Argon2id before the resource is persisted, and never returned,
            logged or audited as a value. Optional: a User created without one exists
            and cannot authenticate until one is set.
        emails:
          type: array
          items:
            $ref: "#/components/schemas/ScimUserEmail"
        meta:
          $ref: "#/components/schemas/ScimMeta"
    ScimListResponse:
      type: object
      required: [schemas, totalResults, startIndex, itemsPerPage]
      description: |
        A SCIM collection. `totalResults` counts every matching resource and not the
        page; `itemsPerPage` is the size of the page actually returned. `Resources` is
        omitted entirely when empty, including for `count=0`.
      properties:
        schemas:
          type: array
          items:
            type: string
          example: ["urn:ietf:params:scim:api:messages:2.0:ListResponse"]
        totalResults:
          type: integer
        startIndex:
          type: integer
        itemsPerPage:
          type: integer
        Resources:
          type: array
          items:
            type: object
    ScimServiceProviderConfig:
      type: object
      description: |
        What this deployment implements. Each flag is asserted in the test suite beside
        the behaviour it advertises, so the document cannot drift from the service.
      properties:
        schemas:
          type: array
          items:
            type: string
        patch:
          $ref: "#/components/schemas/ScimSupportedFlag"
        bulk:
          type: object
          description: Unsupported permanently, with zero limits.
          properties:
            supported:
              type: boolean
            maxOperations:
              type: integer
            maxPayloadSize:
              type: integer
        filter:
          type: object
          properties:
            supported:
              type: boolean
            maxResults:
              type: integer
              description: The page ceiling every collection response obeys.
        changePassword:
          $ref: "#/components/schemas/ScimSupportedFlag"
        sort:
          $ref: "#/components/schemas/ScimSupportedFlag"
        etag:
          $ref: "#/components/schemas/ScimSupportedFlag"
        authenticationSchemes:
          type: array
          description: Exactly one entry, of type `oauthbearertoken`.
          items:
            type: object
        meta:
          type: object
    ScimSupportedFlag:
      type: object
      properties:
        supported:
          type: boolean
