  /scim/v2/Schemas:
    get:
      tags: [SCIM]
      summary: List the SCIM schemas served
      description: |
        Public. The core User and core Group schemas, each listing exactly the
        attributes this service stores — no unimplemented core attribute and no
        extension. `password` is declared `mutability: writeOnly` and
        `returned: never`.
      operationId: listScimSchemas
      security: []
      responses:
        "200":
          description: A ListResponse of schema documents.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimListResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ScimListResponse"
        "403":
          $ref: "#/components/responses/ScimUnsupportedQuery"
        "401":
          $ref: "#/components/responses/ScimDiscoveryCredentialRefused"
  /scim/v2/Schemas/{schemaUri}:
    get:
      tags: [SCIM]
      summary: Read one SCIM schema
      operationId: getScimSchema
      security: []
      parameters:
        - name: schemaUri
          in: path
          required: true
          description: |
            The schema's URI, compared exactly — case-sensitive, because it is an
            identifier. e.g. `urn:ietf:params:scim:schemas:core:2.0:User`.
          schema:
            type: string
      responses:
        "200":
          description: The schema document.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimAnyResource"
            application/json:
              schema:
                $ref: "#/components/schemas/ScimAnyResource"
        "403":
          $ref: "#/components/responses/ScimUnsupportedQuery"
        "404":
          $ref: "#/components/responses/ScimNotFound"
        "401":
          $ref: "#/components/responses/ScimDiscoveryCredentialRefused"
  /scim/v2/Users:
    get:
      tags: [SCIM]
      summary: Query the User collection
      description: |
        RFC 7644 §3.4.2: filter, sort, page and project the Users. The same query can be
        sent as a `SearchRequest` body to `POST /scim/v2/Users/.search`, which returns the
        same result and keeps personal values in the filter out of URLs and access logs.

        **Filtering** — the complete RFC 7644 grammar over every advertised attribute:
        `eq ne co sw ew gt ge lt le pr`, `and`/`or`/`not` with the RFC's precedence
        (`not` > `and` > `or`), parentheses, schema-qualified paths, complex
        sub-attributes (`name.familyName`) and value paths
        (`emails[type eq "work" and value co "@example.com"]`). Attribute names and
        operators are case-insensitive; string values compare as each attribute's
        advertised `caseExact` says (`userName` case-insensitively, `displayName`
        exactly). A bare multi-valued attribute compares its `value`
        (`emails co "example.com"`). An attribute with no value satisfies no comparison
        except `ne`, which is defined as `not eq`; `eq null` means "has no value". The
        common attributes `id`, `externalId` (the calling connector's alias only) and
        `meta.*` are filterable too. Every literal is bound as a statement parameter.

        Refused with `400 invalidFilter`, before anything is read: malformed grammar, an
        attribute this service does not advertise, any `password` path, an operator or
        literal the attribute's type does not support (e.g. `active gt true`,
        `meta.created co "2020"`), filter text over 8 KiB (UTF-8), nesting deeper than 20
        levels, or more than 100 expressions.

        **Sorting** — one `sortBy` and `sortOrder=ascending|descending` (default
        ascending). A complex attribute needs a sub-attribute (`name` is refused,
        `name.familyName` is not); a multi-valued one sorts by its primary value, else its
        first; a missing value sorts last ascending and first descending; resources with
        equal keys are ordered by `id`. Text sorts in byte order, lower-cased first for a
        case-insensitive attribute. An unsortable `sortBy` or unknown `sortOrder` is
        `400 invalidValue`. With no `sortBy` the order is by normalized `userName`.

        **Paging** — `startIndex` is one-based and defaults to 1 (anything lower becomes
        1); `count` defaults to 100, is capped at 200, and a negative value becomes 0;
        `count=0` returns no `Resources` but still reports `totalResults`. Paging is
        stateless.

        **Audit** — one bulk-read event per query, whatever it returned (an empty result
        and a one-User page included), carrying the number of Users returned and the
        filter's shape (`userName eq ?`) — never a literal. A query refused as invalid
        read nothing and records nothing. `GET /scim/v2/Users/{id}` is not audited.
      operationId: listScimUsers
      security:
        - connectorBearer: []
      parameters:
        - $ref: "#/components/parameters/ScimFilter"
        - $ref: "#/components/parameters/ScimSortBy"
        - $ref: "#/components/parameters/ScimSortOrder"
        - $ref: "#/components/parameters/ScimStartIndex"
        - $ref: "#/components/parameters/ScimCount"
        - $ref: "#/components/parameters/ScimAttributes"
        - $ref: "#/components/parameters/ScimExcludedAttributes"
      responses:
        "200":
          description: A ListResponse of User resources.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimListResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ScimListResponse"
        "400":
          $ref: "#/components/responses/ScimBadRequest"
        "401":
          $ref: "#/components/responses/ScimUnauthenticated"
    post:
      tags: [SCIM]
      summary: Create a User
      description: |
        Requires a read-write token; a read-only one is refused with `403` and
        `WWW-Authenticate: Bearer error="insufficient_scope"` before any handler runs.

        `password` is optional — a credentialless User is a supported state and
        cannot authenticate until a password is set. A supplied password is hashed
        before the resource is persisted and appears in no response, no log and no
        audit event. It must satisfy the password policy — the one `/api/auth/change-password`
        applies: 12 to 256 characters after normalization, and not containing the
        `userName` case-insensitively. A password that breaks it is refused with
        `400 invalidValue` before anything is written; the `detail` names the unmet rule
        (`TOO_SHORT`, `TOO_LONG`, `CONTAINS_USER_NAME`) and never the value, and the
        refusal is audited. Read-only attributes in the body (`id`, `meta`, `groups`) are
        ignored, as RFC 7644 requires, so a client may round-trip a resource it read;
        an attribute this service does not implement is refused with
        `400 invalidValue` rather than dropped. `active` defaults to true.

        `externalId` is scoped to the calling connector: two connectors hold
        independent aliases for one User and each sees only its own.
      operationId: createScimUser
      security:
        - connectorBearer: []
      parameters:
        - $ref: "#/components/parameters/ScimAttributes"
        - $ref: "#/components/parameters/ScimExcludedAttributes"
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: "#/components/schemas/ScimUser"
          application/json:
            schema:
              $ref: "#/components/schemas/ScimUser"
      responses:
        "201":
          description: |
            The canonical resource. `Location` names it and `ETag` is its strong
            validator, the same string as `meta.version`.
          headers:
            Location:
              description: Absolute URI of the created User.
              schema:
                type: string
            ETag:
              description: Strong validator, e.g. `"1"`.
              schema:
                type: string
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimUser"
            application/json:
              schema:
                $ref: "#/components/schemas/ScimUser"
        "400":
          $ref: "#/components/responses/ScimBadRequest"
        "401":
          $ref: "#/components/responses/ScimUnauthenticated"
        "403":
          description: |
            The token is read-only. Carries `WWW-Authenticate: Bearer
            error="insufficient_scope"` and no body — the refusal is about the
            credential's scope, which RFC 6750 states in the challenge.
        "409":
          description: A live User already holds that userName, case-insensitively.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "415":
          $ref: "#/components/responses/ScimUnsupportedMediaType"
  /scim/v2/Users/.search:
    post:
      tags: [SCIM]
      summary: Query the User collection with a SearchRequest body
      description: |
        RFC 7644 §3.4.3. Exactly the query `GET /scim/v2/Users` answers — same filter
        grammar and limits, sorting, paging, projection and audit — written as a body, so
        the filter's personal values stay out of URLs and access logs. A `POST` that
        reads: a `READ_ONLY` token may call it.

        The body must declare exactly the `SearchRequest` schema and carry only its
        members, matched case-insensitively; an unknown member, a missing schema or a
        body that is not an object is `400 invalidSyntax`, and a member of the wrong type
        (a string `count`, a numeric `filter`) is `400 invalidValue`. `attributes` and
        `excludedAttributes` are arrays of paths and are mutually exclusive.
      operationId: searchScimUsers
      security:
        - connectorBearer: []
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: "#/components/schemas/ScimSearchRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/ScimSearchRequest"
      responses:
        "200":
          description: A ListResponse of User resources, as the equivalent GET returns.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimListResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ScimListResponse"
        "400":
          $ref: "#/components/responses/ScimBadRequest"
        "401":
          $ref: "#/components/responses/ScimUnauthenticated"
        "415":
          $ref: "#/components/responses/ScimUnsupportedMediaType"
  /scim/v2/Users/{id}:
    get:
      tags: [SCIM]
      summary: Retrieve one User
      description: |
        Not audited: a single-resource read is the ordinary unit of provisioning
        traffic, and recording it would bury the collection reads that indicate an
        enumeration. An id that is not a UUID is a `404` like any other unknown id.
      operationId: getScimUser
      security:
        - connectorBearer: []
      parameters:
        - name: id
          in: path
          required: true
          description: The resource's stable SCIM id.
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/ScimAttributes"
        - $ref: "#/components/parameters/ScimExcludedAttributes"
      responses:
        "200":
          description: The canonical resource.
          headers:
            ETag:
              description: Strong validator, the same string as `meta.version`.
              schema:
                type: string
            Location:
              description: Absolute URI of this User.
              schema:
                type: string
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimUser"
            application/json:
              schema:
                $ref: "#/components/schemas/ScimUser"
        "400":
          $ref: "#/components/responses/ScimBadRequest"
        "401":
          $ref: "#/components/responses/ScimUnauthenticated"
        "404":
          $ref: "#/components/responses/ScimNotFound"
    put:
      tags: [SCIM]
      summary: Replace a User
      description: |
        Replaces the User. The body is a complete User resource, read exactly as a create
        is — the one core User schema, a required `userName`, and no unimplemented
        attribute — and what it omits is what a replacement means:

        - an omitted optional attribute (`name`, `displayName`, `preferredLanguage`,
          `locale`, `timezone`, `emails`) becomes unassigned;
        - an omitted `active` becomes `true`, its create default, which RFC 7644 §3.5.1
          allows a replacement to assign;
        - an omitted `password` leaves the stored credential as it is and still usable,
          because a write-only secret can never be read back and resent;
        - read-only attributes (`id`, `meta`, `groups`) are ignored, so a client may PUT
          back what it read;
        - `externalId` is fixed at creation: omitting it or restating the stored value is
          accepted and changes nothing, and a different value is refused with
          `400 mutability` — as PATCH refuses it — rather than silently dropped.

        The version — and `meta.lastModified` — advance exactly once for a write that
        changes anything, and not at all for one that restates the stored state.

        A supplied `password` goes through the password policy, in the order
        `/api/auth/change-password` applies it: first the intrinsic rules — 12 to 256
        characters after normalization, and not containing the `userName` the write leaves
        the User with, case-insensitively — and only then the password history, which
        refuses a value matching, after normalization, any of the User's three most recent
        passwords, the current one included. Each refusal is `400 invalidValue`, audited,
        and writes nothing; the `detail` names the first unmet rule (`TOO_SHORT`,
        `TOO_LONG`, `CONTAINS_USER_NAME`, or reuse), never the value. A successful change
        remembers the new password and forgets the oldest.

        **Sessions.** A write that deactivates the User (`active` true to false), sets or
        changes its password, or changes its `userName` ends every session the User holds
        — after the write commits, so a refused or rolled-back write ends nothing. An
        ordinary profile or email change ends none. The write and the revocation are each
        audited, the revocation with its outcome.

        The Bootstrap Admin cannot be written: `400 mutability`. A write that changes
        nothing is still audited, with no changed paths.
      operationId: replaceScimUser
      security:
        - connectorBearer: []
      parameters:
        - name: id
          in: path
          required: true
          description: The User's stable SCIM id. An id that is not a UUID is a `404`.
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/ScimIfMatch"
        - $ref: "#/components/parameters/ScimAttributes"
        - $ref: "#/components/parameters/ScimExcludedAttributes"
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: "#/components/schemas/ScimUser"
          application/json:
            schema:
              $ref: "#/components/schemas/ScimUser"
      responses:
        "200":
          $ref: "#/components/responses/ScimUserResource"
        "400":
          $ref: "#/components/responses/ScimProtectedOrBadRequest"
        "401":
          $ref: "#/components/responses/ScimUnauthenticated"
        "403":
          description: |
            The token is read-only. Carries `WWW-Authenticate: Bearer
            error="insufficient_scope"` and no body.
        "404":
          $ref: "#/components/responses/ScimNotFound"
        "409":
          description: Another live User already holds that userName.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "412":
          $ref: "#/components/responses/ScimPreconditionFailed"
        "428":
          $ref: "#/components/responses/ScimPreconditionRequired"
        "415":
          $ref: "#/components/responses/ScimUnsupportedMediaType"
    patch:
      tags: [SCIM]
      summary: Modify a User
      description: |
        Applies RFC 7644 §3.5.2 operations in order. **All or nothing:** the operations
        are folded onto the stored User in memory and the result is written once, so a
        request whose last operation is refused leaves the earlier ones unapplied — a
        re-read returns the User exactly as it was. A request whose operations change
        nothing advances neither the version nor `meta.lastModified`.

        `op` is `add`, `remove` or `replace`, case-insensitively. Paths are matched
        case-insensitively and may carry the core User schema URN as a prefix:

        | `path` | Meaning |
        | --- | --- |
        | `userName`, `displayName`, `preferredLanguage`, `locale`, `timezone` | `add`/`replace` set it; `remove` unassigns it — refused for `userName`, which is required (`mutability`) |
        | `active` | `add`/`replace` set it; `remove` returns it to its default, `true` |
        | `password` | `add`/`replace` set it, through the password history; `remove` makes the User credentialless |
        | `name` | `add`/`replace` with an object merge the named sub-attributes; `remove` unassigns it |
        | `name.<sub>` | set or remove one sub-attribute |
        | `emails` | `add` appends, `replace` replaces the list, `remove` clears it |
        | `emails[<filter>]` | `add`/`replace` with an object write the named sub-attributes onto the matching values; `remove` removes them |
        | `emails[<filter>].<sub>` or `emails.<sub>` | set or remove one sub-attribute on the matching (or every) value; removing `value` is `mutability` |
        | none | `add`/`replace` apply each attribute of the object value as if it were the path; read-only attributes and `externalId` in it are ignored; `remove` without a path is `noTarget` |

        An email value marked `primary` takes primacy from every other value.

        A value filter is one or more `<sub> eq <value>` comparisons on `value`, `type`
        or `primary`, joined by `and`; `type` compares case-insensitively, `value`
        exactly. Any other operator, `or`, `not` or grouping is `400 invalidFilter` in a
        PATCH path — the full grammar applies to queries, and a PATCH selector that
        approximated it would change values the client did not ask for.

        | Refusal | `scimType` |
        | --- | --- |
        | not a `PatchOp`, no operations, unknown `op` | `invalidSyntax` |
        | malformed path, unimplemented attribute, filter or sub-attribute where there is none | `invalidPath` |
        | unsupported filter | `invalidFilter` |
        | `id`, `meta`, `groups`, `schemas` or `externalId` as a path; removing a required value | `mutability` |
        | a filter that matches no value; `remove` with no path | `noTarget` |
        | a value of the wrong type; a password the policy refuses (too short, too long, containing the `userName`, or reused) | `invalidValue` |

        The password policy and its order, password history, session revocation, audit and
        Bootstrap Admin rules are those of PUT. Returns `200` with the patched resource
        rather than `204`, so the
        client learns the new ETag without re-reading.
      operationId: patchScimUser
      security:
        - connectorBearer: []
      parameters:
        - name: id
          in: path
          required: true
          description: The User's stable SCIM id. An id that is not a UUID is a `404`.
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/ScimIfMatch"
        - $ref: "#/components/parameters/ScimAttributes"
        - $ref: "#/components/parameters/ScimExcludedAttributes"
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: "#/components/schemas/ScimPatchOp"
          application/json:
            schema:
              $ref: "#/components/schemas/ScimPatchOp"
      responses:
        "200":
          $ref: "#/components/responses/ScimUserResource"
        "400":
          $ref: "#/components/responses/ScimProtectedOrBadRequest"
        "401":
          $ref: "#/components/responses/ScimUnauthenticated"
        "403":
          description: |
            The token is read-only. Carries `WWW-Authenticate: Bearer
            error="insufficient_scope"` and no body.
        "404":
          $ref: "#/components/responses/ScimNotFound"
        "409":
          description: Another live User already holds that userName.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "412":
          $ref: "#/components/responses/ScimPreconditionFailed"
        "428":
          $ref: "#/components/responses/ScimPreconditionRequired"
        "415":
          $ref: "#/components/responses/ScimUnsupportedMediaType"
    delete:
      tags: [SCIM]
      summary: Delete a User
      description: |
        Removes the User and everything readable about it — profile, emails,
        credential and password history, Group memberships and connector aliases —
        advances the version of every Group it was a member of, and ends every
        session it holds once the deletion commits. A refused or rolled-back
        deletion ends none.

        `204` with no body. Every later operation on the id — GET, PUT, PATCH,
        DELETE — is a `404`, and the User no longer appears in any listing.

        What remains is a tombstone holding only the stable id, the resource type
        and the deletion time (UTC). It is never consulted for uniqueness: the
        former `userName` is accepted by the next create with no conflict, as RFC
        7644 §3.6 allows. The deletion is audited as its own event naming the User
        by that stable id, followed by the session revocation's own event.

        The Bootstrap Admin cannot be deleted; the attempt is `400 mutability`,
        deletes nothing and is audited as a refusal.

        Requires `If-Match` with the User's current ETag, under the same rules as
        PUT and PATCH; see the parameter.
      operationId: deleteScimUser
      security:
        - connectorBearer: []
      parameters:
        - name: id
          in: path
          required: true
          description: The User's stable SCIM id. An id that is not a UUID is a `404`.
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/ScimIfMatch"
      responses:
        "204":
          description: The User is gone.
        "400":
          $ref: "#/components/responses/ScimProtectedOrBadRequest"
        "401":
          $ref: "#/components/responses/ScimUnauthenticated"
        "403":
          description: |
            The token is read-only. Carries `WWW-Authenticate: Bearer
            error="insufficient_scope"` and no body.
        "404":
          $ref: "#/components/responses/ScimNotFound"
        "412":
          $ref: "#/components/responses/ScimPreconditionFailed"
        "428":
          $ref: "#/components/responses/ScimPreconditionRequired"
  /scim/v2/Groups:
    get:
      tags: [SCIM]
      summary: Query the Group collection
      description: |
        The User collection's query contract over Groups: the same filter grammar, limits,
        sorting, paging, projection and audit, against the Group vocabulary (`displayName`
        compares case-insensitively; `members.value`, `members.display`,
        `members.$ref` and `members.type` are filterable; a deleted User is no longer a
        member). With no `sortBy` the order is by normalized `displayName`. The same query
        can be sent to `POST /scim/v2/Groups/.search`.
      operationId: listScimGroups
      security:
        - connectorBearer: []
      parameters:
        - $ref: "#/components/parameters/ScimFilter"
        - $ref: "#/components/parameters/ScimSortBy"
        - $ref: "#/components/parameters/ScimSortOrder"
        - $ref: "#/components/parameters/ScimStartIndex"
        - $ref: "#/components/parameters/ScimCount"
        - $ref: "#/components/parameters/ScimAttributes"
        - $ref: "#/components/parameters/ScimExcludedAttributes"
      responses:
        "200":
          description: A ListResponse of Group resources.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimListResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ScimListResponse"
        "400":
          $ref: "#/components/responses/ScimBadRequest"
        "401":
          $ref: "#/components/responses/ScimUnauthenticated"
    post:
      tags: [SCIM]
      summary: Create a Group
      description: |
        Requires a read-write token; a read-only one is refused with `403` and
        `WWW-Authenticate: Bearer error="insufficient_scope"` before any handler runs.

        **A Group's membership is what confers application authority**, which is why
        two rules here are stricter than RFC 7643 requires.

        `displayName` is unique across live Groups, case-insensitively, and is
        advertised as `uniqueness=server`. The RFC leaves it non-unique; this
        directory does not, because two Groups an administrator reads as the same name
        is how membership of the wrong one gets granted.

        `members` accepts **direct User members only**. A member id naming a Group, a
        deleted User, or nothing at all is one refusal — `400 invalidValue` — and they
        are deliberately indistinguishable: telling them apart would disclose the
        existence and type of resources the caller has not been shown. Nested and
        transitive membership are unsupported, and there is no representation for
        them. Every `members` sub-attribute other than `value` is read-only and
        IGNORED on write: `display` is derived from the referenced User, `$ref` is
        built from its id, and `type` is always `User`.

        An empty Group is legitimate and renders no `members` attribute at all.

        Creating a Group with members advances each member User's version, because
        that User's rendered `groups` gained an entry.

        `externalId` is scoped to the calling connector, exactly as it is for a User.
      operationId: createScimGroup
      security:
        - connectorBearer: []
      parameters:
        - $ref: "#/components/parameters/ScimAttributes"
        - $ref: "#/components/parameters/ScimExcludedAttributes"
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: "#/components/schemas/ScimGroup"
          application/json:
            schema:
              $ref: "#/components/schemas/ScimGroup"
      responses:
        "201":
          description: |
            The canonical resource. `Location` names it and `ETag` is its strong
            validator, the same string as `meta.version`.
          headers:
            Location:
              description: Absolute URI of the created Group.
              schema:
                type: string
            ETag:
              description: Strong validator, e.g. `"1"`.
              schema:
                type: string
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimGroup"
            application/json:
              schema:
                $ref: "#/components/schemas/ScimGroup"
        "400":
          $ref: "#/components/responses/ScimBadRequest"
        "401":
          $ref: "#/components/responses/ScimUnauthenticated"
        "403":
          description: |
            The token is read-only. Carries `WWW-Authenticate: Bearer
            error="insufficient_scope"` and no body — the refusal is about the
            credential's scope, which RFC 6750 states in the challenge.
        "409":
          description: A live Group already holds that displayName, case-insensitively.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "415":
          $ref: "#/components/responses/ScimUnsupportedMediaType"
  /scim/v2/Groups/.search:
    post:
      tags: [SCIM]
      summary: Query the Group collection with a SearchRequest body
      description: |
        The Group counterpart of `POST /scim/v2/Users/.search`: exactly the query
        `GET /scim/v2/Groups` answers, written as a `SearchRequest` body, on the same
        terms. A `READ_ONLY` token may call it.
      operationId: searchScimGroups
      security:
        - connectorBearer: []
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: "#/components/schemas/ScimSearchRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/ScimSearchRequest"
      responses:
        "200":
          description: A ListResponse of Group resources, as the equivalent GET returns.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimListResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ScimListResponse"
        "400":
          $ref: "#/components/responses/ScimBadRequest"
        "401":
          $ref: "#/components/responses/ScimUnauthenticated"
        "415":
          $ref: "#/components/responses/ScimUnsupportedMediaType"
  /scim/v2/.search:
    post:
      tags: [SCIM]
      summary: Search Users and Groups together
      description: |
        RFC 7644 §3.4.3 at the service root: one `SearchRequest` over both resource
        types, returned as one ListResponse. A `READ_ONLY` token may call it.

        A path is valid when either type has it. Where one type lacks it, the filter
        treats it as having no value there — `userName pr` selects no Group,
        `not (userName pr)` selects every Group, and `ne` is true — and a schema-qualified
        path (`urn:ietf:params:scim:schemas:core:2.0:Group:displayName`) applies to that
        type only. Projection works the same way: `attributes=["userName"]` leaves each
        Group its `schemas` and `id`. A path neither type has is refused as it is on a
        single-type endpoint.

        `totalResults` counts both types. With no `sortBy` the Users come first, each type
        in its own default order; with one, a type lacking the attribute sorts as missing.
        Audited as ONE bulk read (`SCIM_RESOURCE_LIST`, resource type `User,Group`) with
        the number of resources returned and the filter's shape.
      operationId: searchScimResources
      security:
        - connectorBearer: []
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: "#/components/schemas/ScimSearchRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/ScimSearchRequest"
      responses:
        "200":
          description: A ListResponse of User and Group resources, interleaved in order.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimListResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ScimListResponse"
        "400":
          $ref: "#/components/responses/ScimBadRequest"
        "401":
          $ref: "#/components/responses/ScimUnauthenticated"
        "415":
          $ref: "#/components/responses/ScimUnsupportedMediaType"
  /scim/v2/Groups/{id}:
    get:
      tags: [SCIM]
      summary: Retrieve one Group
      description: |
        Not audited, for the reason a single User read is not: a single-resource read
        is the ordinary unit of provisioning traffic, and recording it would bury the
        collection reads that indicate an enumeration. An id that is not a UUID — and
        an id that names a User — are both a `404` like any other unknown id.
      operationId: getScimGroup
      security:
        - connectorBearer: []
      parameters:
        - $ref: "#/components/parameters/ScimGroupId"
        - $ref: "#/components/parameters/ScimAttributes"
        - $ref: "#/components/parameters/ScimExcludedAttributes"
      responses:
        "200":
          $ref: "#/components/responses/ScimGroupResource"
        "400":
          $ref: "#/components/responses/ScimBadRequest"
        "401":
          $ref: "#/components/responses/ScimUnauthenticated"
        "404":
          $ref: "#/components/responses/ScimNotFound"
    put:
      tags: [SCIM]
      summary: Replace a Group
      description: |
        Replaces everything a connector may write: the `displayName` and the WHOLE
        membership. An attribute the document does not mention is set to nothing
        rather than left alone — that is what replacing a resource means — so a PUT
        with no `members` empties the Group.

        `externalId` in the body is accepted and DISCARDED, so a client may PUT back a
        resource it read. The alias belongs to the connector's relationship with the
        resource and is established at creation: a PUT that could change it would let
        a replacement silently re-key the resource in the caller's own namespace, and
        one that had to restate it would delete the alias of every connector that
        omitted the field.

        **Version increments reach other resources.** A membership change advances
        this Group's version and the version of every User added or removed. A
        `displayName` change advances this Group's version and the version of every
        CURRENT member, because the label rendered inside their `groups` changed. A
        write that moves both touches the union of the old and the new membership.

        Requires `If-Match` with the Group's current ETag; see the parameter.
      operationId: replaceScimGroup
      security:
        - connectorBearer: []
      parameters:
        - $ref: "#/components/parameters/ScimGroupId"
        - $ref: "#/components/parameters/ScimIfMatch"
        - $ref: "#/components/parameters/ScimAttributes"
        - $ref: "#/components/parameters/ScimExcludedAttributes"
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: "#/components/schemas/ScimGroup"
          application/json:
            schema:
              $ref: "#/components/schemas/ScimGroup"
      responses:
        "200":
          $ref: "#/components/responses/ScimGroupResource"
        "400":
          $ref: "#/components/responses/ScimProtectedOrBadRequest"
        "401":
          $ref: "#/components/responses/ScimUnauthenticated"
        "403":
          description: |
            The token is read-only. Carries `WWW-Authenticate: Bearer
            error="insufficient_scope"` and no body.
        "404":
          $ref: "#/components/responses/ScimNotFound"
        "409":
          description: Another live Group already holds that displayName.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "412":
          $ref: "#/components/responses/ScimPreconditionFailed"
        "428":
          $ref: "#/components/responses/ScimPreconditionRequired"
        "415":
          $ref: "#/components/responses/ScimUnsupportedMediaType"
    patch:
      tags: [SCIM]
      summary: Modify a Group
      description: |
        The operation a provisioning system uses to grant or revoke a membership
        without resending the whole Group — which a PUT would force it to do, and
        which would overwrite concurrent changes it never read.

        **Partial failure applies nothing.** The operations are folded into one
        desired state and written once, so a sequence whose third operation is refused
        leaves the first two unapplied: there is no intermediate state to roll back,
        because none was ever written.

        Each operation requires a `path`, and the supported paths are a closed set —
        a Group has two writable attributes. Paths and `op` are matched
        case-insensitively, and a path may carry the core Group schema URN as a prefix:

        | `op` | `path` | Meaning |
        | --- | --- | --- |
        | `add`, `replace` | `displayName` | Set the label. The attribute is single-valued, so adding to it replaces it (RFC 7644 §3.5.2.1). |
        | `remove` | `displayName` | Refused with `mutability`: `displayName` is required. |
        | `add` | `members` | Add the named Users, leaving existing members in place. An id already present is a no-op, not a conflict. |
        | `replace` | `members` | Replace the whole membership. |
        | `remove` | `members` | With a value, remove the named Users; with none, clear the membership. Removing a non-member is a no-op. |
        | `remove` | `members[value eq "<id>"]` | Remove one member. The only value-path form accepted, because it is the one that occurs. |

        | Refusal | `scimType` |
        | --- | --- |
        | not a `PatchOp`, no operations | `invalidSyntax` |
        | an unimplemented path, or a members value path on anything but `remove` | `invalidPath` |
        | `id`, `meta` or `schemas` as a path; removing `displayName` | `mutability` |
        | `remove` with no path (RFC 7644 §3.5.2.2) | `noTarget` |
        | `add`/`replace` with no path, an unknown `op`, a value of the wrong type, a member that is not a live User, more than 100 operations | `invalidValue` |

        Returns `200` with the patched resource rather than `204`, which RFC 7644
        permits either of: a membership change advances versions, and a client given
        no body would have to re-read the resource to learn its new ETag.

        The same cross-resource version increments, and the same `If-Match`
        requirement, apply as for PUT.
      operationId: patchScimGroup
      security:
        - connectorBearer: []
      parameters:
        - $ref: "#/components/parameters/ScimGroupId"
        - $ref: "#/components/parameters/ScimIfMatch"
        - $ref: "#/components/parameters/ScimAttributes"
        - $ref: "#/components/parameters/ScimExcludedAttributes"
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: "#/components/schemas/ScimPatchOp"
          application/json:
            schema:
              $ref: "#/components/schemas/ScimPatchOp"
      responses:
        "200":
          $ref: "#/components/responses/ScimGroupResource"
        "400":
          $ref: "#/components/responses/ScimProtectedOrBadRequest"
        "401":
          $ref: "#/components/responses/ScimUnauthenticated"
        "403":
          description: |
            The token is read-only. Carries `WWW-Authenticate: Bearer
            error="insufficient_scope"` and no body.
        "404":
          $ref: "#/components/responses/ScimNotFound"
        "409":
          description: Another live Group already holds that displayName.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "412":
          $ref: "#/components/responses/ScimPreconditionFailed"
        "428":
          $ref: "#/components/responses/ScimPreconditionRequired"
        "415":
          $ref: "#/components/responses/ScimUnsupportedMediaType"
    delete:
      tags: [SCIM]
      summary: Delete a Group
      description: |
        Removes the Group and its memberships, and advances the version of every User
        that was a member — their `groups` just lost an entry.

        `204` with no body. A Group that is not there is a `404` rather than a silent
        success: a connector converging on a desired state needs to know whether the
        id it holds was ever real.

        The Admin group cannot be deleted; the attempt is `400 mutability` and removes
        nothing. What remains of a deleted Group is a tombstone holding only its
        stable id, the resource type and the deletion time; it is never consulted for
        uniqueness, so the former `displayName` is accepted by the next create.

        Requires `If-Match` with the Group's current ETag; see the parameter.
      operationId: deleteScimGroup
      security:
        - connectorBearer: []
      parameters:
        - $ref: "#/components/parameters/ScimGroupId"
        - $ref: "#/components/parameters/ScimIfMatch"
      responses:
        "204":
          description: The Group is gone.
        "400":
          $ref: "#/components/responses/ScimProtectedOrBadRequest"
        "401":
          $ref: "#/components/responses/ScimUnauthenticated"
        "403":
          description: |
            The token is read-only. Carries `WWW-Authenticate: Bearer
            error="insufficient_scope"` and no body.
        "404":
          $ref: "#/components/responses/ScimNotFound"
        "412":
          $ref: "#/components/responses/ScimPreconditionFailed"
        "428":
          $ref: "#/components/responses/ScimPreconditionRequired"
  /scim/v2/Me:
    get:
      tags: [SCIM]
      summary: Not implemented — /Me
      description: |
        RFC 7644 §3.11's alias for the authenticated User. A connector token
        represents a directory, not an end User, so `/Me` has nothing to name:
        every method is `501` once the credential is accepted.
      operationId: getScimMe
      security:
        - connectorBearer: []
      responses:
        "401":
          $ref: "#/components/responses/ScimUnauthenticated"
        "501":
          $ref: "#/components/responses/ScimNotImplemented"
    post:
      tags: [SCIM]
      summary: Not implemented — /Me
      operationId: createScimMe
      security:
        - connectorBearer: []
      responses:
        "401":
          $ref: "#/components/responses/ScimUnauthenticated"
        "501":
          $ref: "#/components/responses/ScimNotImplemented"
    put:
      tags: [SCIM]
      summary: Not implemented — /Me
      operationId: replaceScimMe
      security:
        - connectorBearer: []
      responses:
        "401":
          $ref: "#/components/responses/ScimUnauthenticated"
        "501":
          $ref: "#/components/responses/ScimNotImplemented"
    patch:
      tags: [SCIM]
      summary: Not implemented — /Me
      operationId: patchScimMe
      security:
        - connectorBearer: []
      responses:
        "401":
          $ref: "#/components/responses/ScimUnauthenticated"
        "501":
          $ref: "#/components/responses/ScimNotImplemented"
    delete:
      tags: [SCIM]
      summary: Not implemented — /Me
      operationId: deleteScimMe
      security:
        - connectorBearer: []
      responses:
        "401":
          $ref: "#/components/responses/ScimUnauthenticated"
        "501":
          $ref: "#/components/responses/ScimNotImplemented"
  /actuator/health:
    get:
      tags: [Health]
      summary: Get application health
      operationId: getHealth
      security: []
      responses:
        "200":
          description: The application is healthy.
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: The application is unhealthy.
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /actuator/prometheus:
    get:
      tags: [Health]
      summary: Scrape operational telemetry
      operationId: scrapeMetrics
      description: |
        Prometheus text exposition of the service's operational telemetry: request
        count and latency histogram (`http_server_requests_seconds`) tagged by route
        template, method, status, status class (`outcome`), `scim_resource_type`,
        `scim_type` and `scim_connector`; database-pool, Tomcat-thread, Redis and
        scheduled-job saturation gauges. No tag carries a userName, externalId,
        resource id, filter text or token value.

        Admin sessions only, decided by the filter chain before this operation runs:
        an account with any other role gets 403. A connector bearer token is not a
        credential on this path and gets 401. Deployments may move it to an internal
        management port (`MANAGEMENT_SERVER_PORT`), where the same rule applies.
      responses:
        "200":
          description: The current scrape.
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRoleRequired"
  /actuator/info:
    get:
      tags: [Health]
      summary: Read the build and application info
      operationId: getInfo
      description: |
        Spring Boot's info endpoint, exposed beside the scrape and under the same rule:
        Admin sessions only, decided by the filter chain. It carries whatever
        `InfoContributor`s the deployment enables, which by default is nothing, so
        the body is an empty object.
      responses:
        "200":
          description: The info document.
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                type: object
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRoleRequired"
security:
  - sessionCookie: []
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: HTTP session created by a successful login.
    connectorBearer:
      type: http
      scheme: bearer
      description: |
        An opaque connector token issued by an administrator of this deployment,
        presented as `Authorization: Bearer <value>` on every SCIM resource request.
        Accepted in that header and nowhere else — never from a query string, a form
        body or a cookie. There is no authorization server and no grant flow.
  parameters:
    ScimFilter:
      name: filter
      in: query
      required: false
      description: |
        An RFC 7644 §3.4.2.2 filter, e.g. `userName eq "bjensen" and emails[type eq "work"]`.
        See the collection operation for the grammar, the semantics and the limits
        (8 KiB, 20 levels, 100 expressions). Prefer the `.search` endpoint when the
        filter carries personal values. An invalid filter is `400 invalidFilter`.
      schema:
        type: string
        maxLength: 8192
    ScimSortBy:
      name: sortBy
      in: query
      required: false
      description: |
        One attribute path to sort by — a simple attribute or a sub-attribute, never a
        complex attribute itself, never `password`. Unsortable is `400 invalidValue`.
      schema:
        type: string
    ScimSortOrder:
      name: sortOrder
      in: query
      required: false
      description: |
        `ascending` (the default) or `descending`, case-insensitive; ignored without a
        `sortBy`. Anything else is `400 invalidValue`.
      schema:
        type: string
        enum: [ascending, descending]
    ScimStartIndex:
      name: startIndex
      in: query
      required: false
      description: |
        One-based index of the first resource to return. Defaults to 1; anything below
        1 is coerced to 1 rather than refused, as RFC 7644 asks.
      schema:
        type: integer
    ScimCount:
      name: count
      in: query
      required: false
      description: |
        Page size. Defaults to 100 and is capped at 200; a negative value becomes 0,
        and 0 returns no `Resources` while still reporting `totalResults`.
      schema:
        type: integer
    ScimAttributes:
      name: attributes
      in: query
      required: false
      description: |
        Comma-separated attribute paths to return, beside the always-returned
        `schemas` and `id`. Mutually exclusive with `excludedAttributes`. Names are
        case-insensitive and may be schema-qualified; a sub-attribute path such as
        `name.givenName` narrows a complex value. A path this service does not
        implement is `400 invalidValue`. `password` is declared `returned: never`, so
        requesting it yields a resource without it rather than an error.
      schema:
        type: string
    ScimExcludedAttributes:
      name: excludedAttributes
      in: query
      required: false
      description: |
        Comma-separated attribute paths to omit. Mutually exclusive with `attributes`;
        an always-returned attribute survives being named here.
      schema:
        type: string
    ScimGroupId:
      name: id
      in: path
      required: true
      description: |
        The Group's stable SCIM id. An id that is not a UUID, and an id that names a
        User rather than a Group, are both a `404` — the id namespace is shared, so
        "not a Group" and "not there" are the same answer and are deliberately not
        told apart.
      schema:
        type: string
        format: uuid
    ScimIfMatch:
      name: If-Match
      in: header
      required: true
      description: |
        Exactly one strong entity tag: the `ETag` (equivalently `meta.version`) of the
        resource as the client last read it, e.g. `"7"`. Required on every PUT, PATCH
        and DELETE against an existing User or Group, because several connectors may
        write the same directory and a write carrying no validator is a lost update.

        Checked AFTER authorization and existence — a read-only token is refused as
        `403` and an unknown id is `404` whatever this header says — and BEFORE
        anything is computed or written, so a refused precondition changes nothing.

        | Sent | Result |
        | --- | --- |
        | nothing | `428`, detail says to GET the resource and retry with its ETag |
        | `*`, a list of tags, a repeated header, or not an entity tag | `400 invalidValue` |
        | one well-formed tag that is not the current version, or a weak `W/` tag | `412` |
        | the current version's exact tag | the write proceeds |

        Two writers holding the same current tag are serialized on the resource: one
        succeeds, and the other then finds the version it holds is stale and receives
        `412`.
      schema:
        type: string
    UserId:
      name: id
      in: path
      required: true
      description: |
        The User to act on, by its stable SCIM resource id — never its `userName`,
        which a connector may change between the Admin reading the row and acting
        on it.
      schema:
        type: string
        format: uuid
    CsrfToken:
      name: X-XSRF-TOKEN
      in: header
      required: true
      description: The current value of the XSRF-TOKEN cookie, echoed back unchanged.
      schema:
        type: string
    ConnectorId:
      name: connectorId
      in: path
      required: true
      description: The connector's stable id.
      schema:
        type: string
        format: uuid
    TokenId:
      name: tokenId
      in: path
      required: true
      description: |
        The token's stable id, as the listing reports it. Not the token value — the
        value is never sent to this service in a URL.
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: A valid authenticated session is required.
    CsrfTokenRejected:
      description: |
        The CSRF token is missing or does not match the XSRF-TOKEN cookie. This is
        decided before authentication, so it is returned even on the public login
        operation.
    AdminAccount:
      description: The account as it stands after the change.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AccountSummary"
    UnknownAccount:
      description: |
        No User has that id. The body is empty; the caller is already an
        administrator, so this reveals nothing the listing would not.
    MalformedUserId:
      description: |
        The path segment is not a UUID — for instance a `userName` where the id
        belongs. Nothing is written.
    UnknownConnector:
      description: |
        No live connector or token has that id. The body is empty, and "never
        existed" and "already deleted" are the same answer: the caller is an
        administrator who can read either from the listing.
    IssuedConnectorToken:
      description: |
        The token, including its plaintext — the only time that value is disclosed.
        Sent with `Cache-Control: no-store`.
      headers:
        Cache-Control:
          description: Always `no-store`; a credential may not be cached.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IssuedConnectorToken"
    AdminRoleRequired:
      description: |
        The session is valid and was accepted; the account's role is what was
        refused. Distinct from 401, which means no usable session arrived at all —
        a client must not treat this as a signal to sign in again. A session
        confined by the change-required flag holds no role, so it receives this
        on every endpoint but the change flow, an Admin's included.
    ScimBadRequest:
      description: |
        The request was not acceptable SCIM: an unparseable or non-object body, a
        schema other than this service's one User schema, a missing required
        attribute, an attribute or sub-attribute this service does not implement, a
        value of the wrong JSON type, a value longer than its stored `maxLength`, or a
        projection naming something that is not an attribute. `scimType` is
        `invalidSyntax` or `invalidValue`; for a query also
        `invalidFilter`, and for a PATCH also `invalidPath`, `noTarget` or
        `mutability` — see the operation.
      content:
        application/scim+json:
          schema:
            $ref: "#/components/schemas/ScimError"
    ScimUnauthenticated:
      description: |
        No bearer token, or one that is malformed, unknown, expired, revoked or whose
        connector was deleted. `WWW-Authenticate` is a bare `Bearer` when no
        credential was presented and `Bearer error="invalid_token"` when one was; the
        several reasons are not told apart, because telling them apart reports whether
        a credential ever existed. No body.
    ScimUnsupportedQuery:
      description: |
        A `filter` parameter on a discovery path, which RFC 7644 says discovery ignores.
        `403` rather than a silently ignored parameter, because an ignored filter is the
        only answer a client cannot tell from a match. No `scimType`.
      content:
        application/scim+json:
          schema:
            $ref: "#/components/schemas/ScimError"
    ScimNotFound:
      description: |
        No live resource, schema or resource type has that identifier.
      content:
        application/scim+json:
          schema:
            $ref: "#/components/schemas/ScimError"
    ScimPreconditionRequired:
      description: |
        The write carried no `If-Match`. No `scimType` exists for this condition. GET
        the resource and retry with its `ETag` in `If-Match`.
      content:
        application/scim+json:
          schema:
            $ref: "#/components/schemas/ScimError"
    ScimPreconditionFailed:
      description: |
        The `If-Match` names a version that is no longer current — another write changed
        the resource first. Nothing was changed; GET it and retry.
      content:
        application/scim+json:
          schema:
            $ref: "#/components/schemas/ScimError"
    ScimUserResource:
      description: |
        The canonical User resource, never carrying a password. `ETag` is its new strong
        validator, the same string as `meta.version`.
      headers:
        ETag:
          description: Strong validator, e.g. `"2"`.
          schema:
            type: string
        Location:
          description: Absolute URI of this User.
          schema:
            type: string
      content:
        application/scim+json:
          schema:
            $ref: "#/components/schemas/ScimUser"
        application/json:
          schema:
            $ref: "#/components/schemas/ScimUser"
    ScimGroupResource:
      description: |
        The canonical Group resource. `ETag` is its strong validator, the same string
        as `meta.version`.
      headers:
        ETag:
          description: Strong validator, e.g. `"1"`.
          schema:
            type: string
        Location:
          description: Absolute URI of this Group.
          schema:
            type: string
      content:
        application/scim+json:
          schema:
            $ref: "#/components/schemas/ScimGroup"
        application/json:
          schema:
            $ref: "#/components/schemas/ScimGroup"
    ScimProtectedOrBadRequest:
      description: |
        Either the request was not acceptable SCIM — see `ScimBadRequest`, `scimType`
        `invalidSyntax` or `invalidValue`, which also covers a member id that does not
        name a live User — or it targeted a resource this deployment reserves for its
        own recovery, with `scimType` `mutability`.

        **The reserved resources and what is refused about them:** the Admin group
        cannot be renamed or deleted, and the Bootstrap Admin's Group membership
        cannot be changed in either direction — it cannot be removed from the Admin
        group and cannot be added to any other Group, because a membership change
        moves that User's computed `groups` and its version, which a client reads.
        The Admin group's ORDINARY membership stays fully writable: granting and
        revoking administrative access is what external provisioning is for.

        `400` rather than `403` deliberately. The token may be a perfectly valid
        read-write one; it is the TARGET that is refused, not the credential, and
        answering `403` would send an integrator to re-check a token scope that is
        fine.

        A refused write changes nothing: every check runs before anything is written,
        so the resource re-reads unchanged, version included.
      content:
        application/scim+json:
          schema:
            $ref: "#/components/schemas/ScimError"
    ScimDiscoveryCredentialRefused:
      description: |
        A discovery endpoint needs no credential, but one that IS presented is still
        authenticated, and a malformed, unknown, expired or revoked token is refused
        with `401` and `WWW-Authenticate: Bearer error="invalid_token"`, as RFC 6750
        §3.1 specifies — the caller is told its credential is bad rather than having
        it silently ignored. No body. Send no `Authorization` header to read
        discovery anonymously.
    ScimUnsupportedMediaType:
      description: |
        The request body is neither `application/scim+json` nor `application/json`.
        Refused before the body is read; nothing is written. No `scimType`.
      content:
        application/scim+json:
          schema:
            $ref: "#/components/schemas/ScimError"
    ScimNoSuchEndpoint:
      description: |
        No endpoint is served at this path — including `/scim/v2/Bulk`, which this
        service does not implement and discovery advertises as unsupported — or the
        deployment has closed the SCIM release gate. No `scimType`.
      content:
        application/scim+json:
          schema:
            $ref: "#/components/schemas/ScimError"
    ScimMethodNotAllowed:
      description: |
        The path is served but not for this method — e.g. `PUT /scim/v2/Users`.
        Carries an `Allow` header listing the methods that are. No `scimType`.
      content:
        application/scim+json:
          schema:
            $ref: "#/components/schemas/ScimError"
    ScimNotAcceptable:
      description: |
        The `Accept` header names neither `application/scim+json` nor
        `application/json`, the only representations served. No `scimType`.
      content:
        application/scim+json:
          schema:
            $ref: "#/components/schemas/ScimError"
    ScimPayloadTooLarge:
      description: |
        The request body exceeds 1 MiB. A body that declares its length is refused
        on that declaration, before it is read and before the credential is
        checked; one sent without a length is refused as it crosses the bound.
        Either way nothing is written. No `scimType`.
      content:
        application/scim+json:
          schema:
            $ref: "#/components/schemas/ScimError"
    ScimNotImplemented:
      description: |
        `/Me` is defined by RFC 7644 §3.11 as an alias for the authenticated User,
        and a connector token does not represent a User, so there is nothing it
        could name. `501` for every method, after authentication. No `scimType`.
      content:
        application/scim+json:
          schema:
            $ref: "#/components/schemas/ScimError"
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          pattern: ".*\\S.*"
        password:
          type: string
          minLength: 1
          pattern: ".*\\S.*"
          format: password
    UserResponse:
      type: object
      required: [username, role, passwordChangeRequired]
      properties:
        username:
          type: string
        role:
          type: [string, "null"]
          enum: [USER, ADMIN, null]
          description: |
            The account role used for authorization. `null` while
            `passwordChangeRequired` is true: a confined session holds no role
            until the password is replaced, an Admin's included.
        passwordChangeRequired:
          type: boolean
          description: |
            Whether this session is confined to the change flow. While true, the
            session may call `GET /api/auth/me`, `POST /api/auth/change-password`
            and `DELETE /api/auth/logout`; every other endpoint, `/api/admin/**`
            included, answers 403.
    SelfRecord:
      type: object
      additionalProperties: false
      required: [id, userName, displayName, groups, passwordChangeRequired, lastAuthenticatedAt]
      description: |
        The whole of what the self-read returns. There is deliberately no lockout
        or failed-login field; `additionalProperties: false` states that the set
        below is closed.
      properties:
        id:
          type: string
          format: uuid
          description: The caller's stable SCIM resource id.
        userName:
          type: string
          description: The caller's login attribute, as stored now.
        displayName:
          type: [string, "null"]
          description: The caller's display name, or `null` when none is set.
        groups:
          type: array
          description: |
            The Groups the caller is a DIRECT member of — the server-seeded Admin
            group included, when it is one — by id and label only. Empty when
            there are none.
          items:
            $ref: "#/components/schemas/SelfGroup"
        passwordChangeRequired:
          type: boolean
          description: Whether the caller's change-required flag is set.
        lastAuthenticatedAt:
          type: [string, "null"]
          format: date-time
          description: |
            When the caller last logged in successfully while no password change
            was required of it, last completed a self-service change, or was last
            reactivated, ISO-8601 in UTC; `null` when none has happened.
    SelfGroup:
      type: object
      additionalProperties: false
      required: [id, displayName]
      properties:
        id:
          type: string
          format: uuid
          description: The Group's stable SCIM resource id.
        displayName:
          type: string
          description: The Group's label.
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
          pattern: ".*\\S.*"
          format: password
        newPassword:
          type: string
          minLength: 1
          pattern: ".*\\S.*"
          format: password
    PasswordRuleViolation:
      type: object
      required: [rule, message]
      description: |
        The first password-policy rule the new password failed. Names the rule;
        never echoes the current or the new value.
      properties:
        rule:
          type: string
          enum: [TOO_SHORT, TOO_LONG, CONTAINS_USER_NAME, REUSED]
          description: |
            `TOO_SHORT` below 12 characters, `TOO_LONG` above 256,
            `CONTAINS_USER_NAME` when it contains the user name (case-insensitive), `REUSED` when it
            equals the current password or one of the 3 most recent ones.
        message:
          type: string
          description: A human-readable statement of the rule.
    AccountSummary:
      type: object
      description: |
        One row of the Users projection. Directory-owned fields (`userName`,
        `displayName`, `active`, `groups`) are read-only here; the rest is
        application-owned state. Returned by the listing and, for the User acted
        on, by `unlock` and `force-password-change`.
      required: [id, userName, displayName, admin, bootstrapAdmin, active, locked,
        hasPassword, passwordChangeRequired, lastAuthenticatedAt, createdAt, groups]
      properties:
        id:
          type: string
          format: uuid
          description: |
            The identity's stable SCIM resource id, non-reassignable. The same id
            the SCIM interface serves this identity under, the id the audit trail
            records, and the id every operation on this row addresses.
        userName:
          type: string
          description: The login attribute. Directory-owned, mutable, read-only here.
        displayName:
          type: [string, "null"]
          description: The directory's display name, or null when it sets none.
        admin:
          type: boolean
          description: |
            Whether this identity holds administrative authority. DERIVED from
            direct membership of the server-seeded Admin group, not stored: there
            is no role column, so this reports the same fact the login path
            derives and there is nothing for the two to disagree about.

            Membership changes take effect at the identity's next login. A session
            already issued carries the authority it was issued with.
        bootstrapAdmin:
          type: boolean
          description: |
            Whether this is the deployment's reserved recovery identity. It can
            never be locked, so it has no lockout state to show and nothing to
            Unlock; only it may force its own password change.
        active:
          type: boolean
          description: |
            SCIM's `active` attribute, owned by the directory and read-only here —
            the former disable and enable operations were removed. An inactive
            identity is refused at login with the same bare `401` as a wrong
            password.
        locked:
          type: boolean
          description: |
            Whether a lockout is in force. Independent of `active` — a lockout is
            imposed automatically by a run of failed logins. It has no expiry and
            there is no field for one: the lockout stands until an administrator
            calls the unlock operation, so this flag is the whole lock state.
            Always false for the Bootstrap Admin.
        hasPassword:
          type: boolean
          description: |
            Whether a credential is set at all. A SCIM-provisioned identity may
            exist with no password — it is a supported state, not an incomplete
            one — and such an identity can be read, can be put in a Group, and
            cannot log in. Reported because "no password was ever set" is
            otherwise indistinguishable from "the password is wrong", and only the
            first is fixed by a SCIM write.

            The value itself is never reported, here or anywhere: this schema has
            no field a hash could occupy.
        passwordChangeRequired:
          type: boolean
          description: |
            The change-required flag: whether the identity must replace its
            password before it may do anything but submit that change or log out.
            Set by every connector password write, by `force-password-change` and
            by `unlock` of an identity that has a password; cleared only by a
            successful `POST /api/auth/change-password`.
        lastAuthenticatedAt:
          type: [string, "null"]
          format: date-time
          description: |
            The last successful login made while no password change was required,
            completed self-service change, or explicit reactivation; null for an
            identity that has had none. Application-owned; not a SCIM attribute.
        createdAt:
          type: string
          format: date-time
          description: When the SCIM resource was created.
        groups:
          type: array
          description: |
            The Groups this identity is a DIRECT member of, ordered by normalized
            display name. Directory-owned and read-only here, as over SCIM.
          items:
            $ref: "#/components/schemas/DirectGroup"
    DirectGroup:
      type: object
      required: [id, displayName]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
    GroupSummary:
      type: object
      description: One row of the read-only Groups projection.
      required: [id, displayName, memberCount, adminGroup]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        memberCount:
          type: integer
          minimum: 0
          description: How many Users are direct members.
        adminGroup:
          type: boolean
          description: |
            Whether this is the protected, server-seeded Admin group whose direct
            members hold administrative authority. Decided by the reservation
            marker, never by the name.
    UpdateSessionRequest:
      type: object
      required: [displayName]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ".*\\S.*"
    SessionResponse:
      type: object
      required: [id, createdAt, maxInactiveIntervalSeconds]
      properties:
        id:
          type: string
        displayName:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        maxInactiveIntervalSeconds:
          type: integer
          format: int32
    CountResponse:
      type: object
      required: [count]
      properties:
        count:
          type: integer
          format: int64
          minimum: 0
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
      additionalProperties: true
    AuditEventPage:
      type: object
      required: [events, page, size, totalElements, totalPages]
      properties:
        events:
          type: array
          description: This page's events, newest first.
          items:
            $ref: "#/components/schemas/AuditEvent"
        page:
          type: integer
          description: The zero-based page number asked for.
        size:
          type: integer
          description: The page size asked for.
        totalElements:
          type: integer
          format: int64
          description: Matching events across every page.
        totalPages:
          type: integer
          format: int64
          description: Pages of `size` those events fill; `0` when none match.
    AuditEvent:
      type: object
      description: |
        One recorded event, exactly as stored. There is no property a password,
        bearer value, hash, `userName`, profile value or literal filter value
        could occupy.
      required: [id, occurredAt, operation, outcome, resourceType, changedPaths, statusClass]
      properties:
        id:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
          description: When the audited operation happened, in UTC.
        operation:
          $ref: "#/components/schemas/AuditOperation"
        outcome:
          $ref: "#/components/schemas/AuditOutcome"
        actorId:
          type: [string, "null"]
          format: uuid
          description: |
            Who acted, by stable id: an Admin or User for authentication and
            administrative events (including connector and token lifecycle), the
            connector for SCIM events. `null` when nobody was authenticated (a
            refused login, a lockout) or when a scheduled job or startup seeding
            acted — the operation names the job.
        subjectId:
          type: [string, "null"]
          format: uuid
          description: The resource acted on; equal to `resourceId`.
        resourceType:
          type: string
          enum: [User, Group, ScimConnector, "User,Group"]
          description: |
            `ScimConnector` for connector and token lifecycle events, named by the
            connector's id rather than the token's; `User,Group` for a base
            `/.search`.
        resourceId:
          type: [string, "null"]
          format: uuid
          description: |
            Stable id of the resource acted on. `null` when the operation named no
            existing resource — a login for an unknown `userName`, a refused
            create, a bulk read.
        changedPaths:
          type: array
          items:
            type: string
          description: Attribute paths the operation changed, never their values; empty when none.
        statusClass:
          type: string
          enum: [ok, client_error, server_error]
        errorCode:
          type: [string, "null"]
          description: A refusal reason from the service's own closed set (e.g. `BAD_CREDENTIALS`), never a message.
        httpMethod:
          type: [string, "null"]
        httpPath:
          type: [string, "null"]
          description: The matched route template, never the resolved path.
        requestId:
          type: [string, "null"]
          description: Correlation id of the triggering request, shared with its log lines.
        resultCount:
          type: [integer, "null"]
          description: How many resources a bulk read returned; `null` for every other operation.
        filterShape:
          type: [string, "null"]
          description: |
            A bulk read's filter with every literal replaced by `?`
            (`userName eq ?`); `null` when it had none or is not a bulk read.
    AuditOutcome:
      type: string
      enum: [SUCCESS, FAILURE]
      description: Whether the audited operation worked — not whether recording it did.
    AuditOperation:
      type: string
      enum:
        - LOGIN_SUCCESS
        - LOGIN_FAILURE
        - LOGOUT
        - LOCKOUT_SET
        - LOCKOUT_LIFT
        - ACCOUNT_DISABLE
        - ACCOUNT_ENABLE
        - CONNECTOR_CREATE
        - CONNECTOR_DELETE
        - CONNECTOR_TOKEN_ISSUE
        - CONNECTOR_TOKEN_ROTATE
        - CONNECTOR_TOKEN_REVOKE
        - SCIM_USER_CREATE
        - SCIM_USER_LIST
        - SCIM_USER_REPLACE
        - SCIM_USER_DELETE
        - USER_SESSIONS_REVOKE
        - SCIM_GROUP_CREATE
        - SCIM_GROUP_REPLACE
        - SCIM_GROUP_DELETE
        - SCIM_GROUP_LIST
        - SCIM_RESOURCE_LIST
        - SCIM_RESOURCE_SEED
        - INACTIVITY_DEACTIVATION
        - DORMANT_AUTHORITY_REVOCATION
        - PASSWORD_CHANGE_REQUIRE
        - PASSWORD_CHANGE
      description: |
        What happened, as a closed set. `LOCKOUT_LIFT` is always an Admin's Unlock:
        a lockout has no duration, so there is no expiry lift.
    ConnectorTokenScope:
      type: string
      enum: [READ_ONLY, READ_WRITE]
      description: |
        Directory-wide. `READ_WRITE` implies read, so there is no scope that can
        mutate a resource it cannot retrieve. Enforced in the SCIM chain's filter
        from the method and path alone, not by a check inside a handler.
    CreateConnectorRequest:
      type: object
      required: [displayName]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 200
          description: The administrator's own label. Carries no authority.
    IssueTokenRequest:
      type: object
      required: [scope]
      properties:
        scope:
          $ref: "#/components/schemas/ConnectorTokenScope"
        lifetimeDays:
          type: [integer, "null"]
          format: int32
          minimum: 1
          maximum: 365
          description: Defaults to 365, which is also the hard maximum.
    RotateTokenRequest:
      type: object
      properties:
        overlapDays:
          type: [integer, "null"]
          format: int32
          description: |
            How long the old token keeps working. Clamped to 14 days and to the life
            the old token had left; absent or zero ends it immediately.
    ConnectorTokenSummary:
      type: object
      required: [id, scope, issuedAt, expiresAt, originalExpiresAt, active]
      description: |
        Has no property a token value or its hash could occupy, and that is
        deliberate: the serialised projection has no such field, so a listing cannot
        disclose a credential even by mistake.
      properties:
        id:
          type: string
          format: uuid
        scope:
          $ref: "#/components/schemas/ConnectorTokenScope"
        issuedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: As it currently stands; a rotation may have brought it forward.
        originalExpiresAt:
          type: string
          format: date-time
          description: |
            The expiry it was issued with, so a shortened overlap window is visible
            as one. Never earlier than `expiresAt`.
        revokedAt:
          type: [string, "null"]
          format: date-time
        active:
          type: boolean
          description: |
            Whether the token would be accepted right now — the server's own
            evaluation, not a comparison the client makes against its own clock.
    ConnectorSummary:
      type: object
      required: [id, displayName, createdAt, tokens]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        createdAt:
          type: string
          format: date-time
        tokens:
          type: array
          description: Every token the connector has held, newest issue first.
          items:
            $ref: "#/components/schemas/ConnectorTokenSummary"
    IssuedConnectorToken:
      type: object
      required: [connectorId, tokenId, scope, issuedAt, expiresAt, presentedValue]
      description: |
        The only schema that carries a token value, returned only by issue and
        rotate. A type of its own rather than a nullable field on
        `ConnectorTokenSummary`, so the shape a listing uses has no property for a
        credential at all.
      properties:
        connectorId:
          type: string
          format: uuid
        tokenId:
          type: string
          format: uuid
        scope:
          $ref: "#/components/schemas/ConnectorTokenScope"
        issuedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        presentedValue:
          type: string
          description: |
            The complete opaque bearer value, sent to the SCIM interface as
            `Authorization: Bearer <value>`. Store it now — this service holds only
            a digest and cannot show it again.
    ScimError:
      type: object
      required: [schemas, status, detail]
      description: |
        The one shape every SCIM refusal from this namespace takes. `status` is a
        STRING, as RFC 7644 §3.12 defines it. `scimType` is present only where the RFC
        defines one for the condition, and is omitted rather than null where it does
        not. `detail` is written by this service and never echoes a submitted value —
        an attribute path, yes; a userName or a password, never. A server-side fault
        is the same document with `status` `"500"` and no `scimType`.
      properties:
        schemas:
          type: array
          items:
            type: string
          example: ["urn:ietf:params:scim:api:messages:2.0:Error"]
        status:
          type: string
          example: "409"
        scimType:
          type: string
          enum: [invalidSyntax, invalidValue, invalidFilter, invalidPath, noTarget,
                 mutability, uniqueness]
        detail:
          type: string
    ScimMeta:
      type: object
      description: |
        Server-owned metadata. Timestamps are UTC with a `Z` offset, as RFC 7643's
        conventions lead a connector to expect; the service's log timestamps use a
        different zone and the two are not reconciled.
      properties:
        resourceType:
          type: string
          example: User
        created:
          type: string
          format: date-time
        lastModified:
          type: string
          format: date-time
        location:
          type: string
          format: uri
          pattern: "^https?://"
          description: |
            The absolute URI the resource is served at (RFC 7643 §3.1), built from the
            scheme, host and port the request arrived on. Absolute on every SCIM resource —
            Users, Groups and the discovery documents (`ServiceProviderConfig`, each
            `ResourceType`, each `Schema`) alike, in list and by-id responses. The
            pattern makes the contract check refuse a relative value.
          example: https://idp.example.com/scim/v2/Users/2819c223-7f76-453a-919d-413861904646
        version:
          type: string
          description: |
            The resource's strong validator, quotes included — the same string as the
            `ETag` header, so a client can compare the two without unwrapping either.
          example: "\"1\""
    ScimUserName:
      type: object
      description: |
        The `name` complex attribute. Every sub-attribute is optional, and the
        attribute is omitted entirely when all of them are absent — SCIM omits an
        unassigned attribute rather than rendering an empty object. Each is at most
        256 characters.
      properties:
        formatted:
          type: string
          maxLength: 256
        familyName:
          type: string
          maxLength: 256
        givenName:
          type: string
          maxLength: 256
        middleName:
          type: string
          maxLength: 256
        honorificPrefix:
          type: string
          maxLength: 256
        honorificSuffix:
          type: string
          maxLength: 256
    ScimUserEmail:
      type: object
      required: [value]
      description: |
        One value of the multi-valued `emails` attribute. `(type, value)` duplicates
        are removed before storage and at most one value may be primary — a second
        claim is demoted rather than refused. `primary` is rendered only when true.
      properties:
        value:
          type: string
          maxLength: 256
        type:
          type: string
          maxLength: 32
          example: work
        primary:
          type: boolean
    ScimUser:
      type: object
      required: [schemas]
      description: |
        A SCIM core User, as this service implements it. Unimplemented core attributes
        and every extension are absent from `/Schemas` and refused when asserted on a
        write.

        `userName` is required on every write, and present on every read except one
        whose `attributes`/`excludedAttributes` projection leaves it out — so it is
        not listed as `required` here, where one schema serves both directions.

        On a write: `id`, `meta` and `groups` are ignored if present, `password` is
        write-only and never returned, and `externalId` is scoped to the calling
        connector. On a read: `password` is never present, and an unassigned attribute
        is omitted rather than rendered null.
      properties:
        schemas:
          type: array
          items:
            type: string
          example: ["urn:ietf:params:scim:schemas:core:2.0:User"]
        id:
          type: string
          format: uuid
          description: Server-assigned, stable, and unique across Users and Groups.
          readOnly: true
        externalId:
          type: string
          maxLength: 256
          description: The calling connector's alias for this resource, case-exact.
        userName:
          type: string
          maxLength: 256
          description: |
            Unique among live Users, case-insensitively, after Unicode NFKC and case
            folding. Mutable, and reusable once its User is deleted. At most 256
            characters both as sent and after normalization, which can lengthen it.
        name:
          $ref: "#/components/schemas/ScimUserName"
        displayName:
          type: string
          maxLength: 256
        preferredLanguage:
          type: string
          maxLength: 64
        locale:
          type: string
          maxLength: 64
        timezone:
          type: string
          maxLength: 64
        active:
          type: boolean
          description: Defaults to true on create. An inactive User cannot log in.
        password:
          type: string
          writeOnly: true
          description: |
            Hashed with Argon2id before the resource is persisted, and never returned,
            logged or audited as a value. Optional: a User created without one exists
            and cannot authenticate until one is set.
        emails:
          type: array
          items:
            $ref: "#/components/schemas/ScimUserEmail"
        meta:
          $ref: "#/components/schemas/ScimMeta"
    ScimGroup:
      type: object
      required: [schemas]
      description: |
        A SCIM core Group, as this service implements it: a label and a direct-User
        membership, and nothing else. What a Group is FOR here is conferring
        authority, so no other attribute would change who may do what.

        `displayName` is required on every write and present on every read that does
        not project it away, as `userName` is for a User.

        On a write: `id` and `meta` are ignored if present, `externalId` is scoped to
        the calling connector and is discarded on a PUT, and every `members`
        sub-attribute other than `value` is read-only and ignored. On a read: an
        unassigned attribute is omitted rather than rendered null, so an empty Group
        renders no `members` at all.
      properties:
        schemas:
          type: array
          items:
            type: string
          example: ["urn:ietf:params:scim:schemas:core:2.0:Group"]
        id:
          type: string
          format: uuid
          description: Server-assigned, stable, and unique across Users and Groups.
          readOnly: true
        externalId:
          type: string
          maxLength: 256
          description: The calling connector's alias for this resource, case-exact.
        displayName:
          type: string
          maxLength: 256
          description: |
            Unique among live Groups, case-insensitively, after Unicode NFKC and case
            folding — stricter than RFC 7643, which leaves it non-unique. At most 256
            characters both as sent and after normalization. Made unique
            because a Group's membership confers authority, and two Groups an
            administrator reads as the same name is how membership of the wrong one
            gets granted.

            The Admin group's name cannot be changed. Its authority is carried by its
            stable id rather than by this string, so the immutability is not about the
            name mattering — it is that a renameable recovery resource is one a
            connector can make unrecognisable to an administrator reading the
            directory.
        members:
          type: array
          description: |
            Direct User members. A member id naming a Group, a deleted User, or nothing
            at all is one indistinguishable `400 invalidValue`. Nested and transitive
            membership are unsupported and have no representation.
          items:
            $ref: "#/components/schemas/ScimGroupMember"
        meta:
          $ref: "#/components/schemas/ScimMeta"
    ScimGroupMember:
      type: object
      required: [value]
      description: |
        One membership. `value` is the only sub-attribute a write supplies; the rest are
        read-only and derived from the referenced User, so a submitted value is ignored
        rather than stored — there is no column it could be written to.
      properties:
        value:
          type: string
          format: uuid
          description: The member User's stable SCIM id.
        display:
          type: string
          description: |
            The referenced User's `displayName`, or its `userName` when it has none.
            Read-only.
          readOnly: true
        $ref:
          type: string
          description: |
            Absolute URI of the referenced User, built from its id rather than stored —
            a stored reference would be wrong the moment the service moved. Read-only.
          readOnly: true
        type:
          type: string
          description: Always `User`; this directory has no Group-valued members.
          readOnly: true
          enum: [User]
    ScimPatchOp:
      type: object
      required: [schemas, Operations]
      description: |
        A SCIM PATCH request. Operations apply in the order given, and the whole
        sequence is folded into one desired state and written once — so a sequence
        whose later operation is refused applies none of the earlier ones.
      properties:
        schemas:
          type: array
          items:
            type: string
          example: ["urn:ietf:params:scim:api:messages:2.0:PatchOp"]
        Operations:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ScimPatchOperation"
    ScimPatchOperation:
      type: object
      required: [op, path]
      description: |
        One operation. `path` is REQUIRED by this service: a path-less `add` would be an
        attribute-by-attribute merge whose semantics for a multi-valued attribute RFC
        7644 leaves genuinely ambiguous, and guessing at it is worse than refusing.
      properties:
        op:
          type: string
          description: Matched case-insensitively, as RFC 7644 §3.5.2 requires.
          enum: [add, replace, remove]
        path:
          type: string
          description: |
            `displayName`, `members`, or `members[value eq "<uuid>"]` — the only
            value-path form accepted, and only with `remove`. Any other path is
            `400 invalidPath`.
          example: members
        value:
          description: |
            A string for `displayName`; an array of member objects for `members`.
            Omitted on a `remove` that clears the whole membership.
    ScimListResponse:
      type: object
      required: [schemas, totalResults, startIndex, itemsPerPage]
      description: |
        A SCIM collection. `totalResults` counts every matching resource and not the
        page; `itemsPerPage` is the size of the page actually returned. `Resources` is
        omitted entirely when empty, including for `count=0`.
      properties:
        schemas:
          type: array
          items:
            type: string
          example: ["urn:ietf:params:scim:api:messages:2.0:ListResponse"]
        totalResults:
          type: integer
        startIndex:
          type: integer
        itemsPerPage:
          type: integer
        Resources:
          type: array
          items:
            $ref: "#/components/schemas/ScimAnyResource"
    ScimAnyResource:
      type: object
      description: |
        A SCIM resource whose own schema varies by endpoint — a listed User, Group,
        ResourceType or Schema, or a discovery document read by id. Typed only by its
        server-owned `meta`, which is enough for the contract check to hold every
        `meta.location` to the same absolute form, in list and by-id responses alike.
      properties:
        meta:
          $ref: "#/components/schemas/ScimMeta"
    ScimSearchRequest:
      type: object
      required: [schemas]
      description: |
        RFC 7644 §3.4.3. Member names are matched case-insensitively; no other member is
        accepted. The values mean exactly what the query parameters of the same names
        mean on a collection `GET`.
      additionalProperties: false
      properties:
        schemas:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: string
            enum: ["urn:ietf:params:scim:api:messages:2.0:SearchRequest"]
        filter:
          type: string
          maxLength: 8192
        sortBy:
          type: string
        sortOrder:
          type: string
          enum: [ascending, descending]
        startIndex:
          type: integer
        count:
          type: integer
        attributes:
          type: array
          items:
            type: string
        excludedAttributes:
          type: array
          items:
            type: string
      example:
        schemas: ["urn:ietf:params:scim:api:messages:2.0:SearchRequest"]
        filter: 'userName eq "bjensen" and emails[type eq "work"]'
        sortBy: name.familyName
        startIndex: 1
        count: 50
        attributes: [userName, emails]
    ScimServiceProviderConfig:
      type: object
      description: |
        What this deployment implements. Each flag is asserted in the test suite beside
        the behaviour it advertises, so the document cannot drift from the service.
      properties:
        schemas:
          type: array
          items:
            type: string
        patch:
          $ref: "#/components/schemas/ScimSupportedFlag"
        bulk:
          type: object
          description: Unsupported permanently, with zero limits.
          properties:
            supported:
              type: boolean
            maxOperations:
              type: integer
            maxPayloadSize:
              type: integer
        filter:
          type: object
          properties:
            supported:
              type: boolean
            maxResults:
              type: integer
              description: The page ceiling every collection response obeys.
        changePassword:
          $ref: "#/components/schemas/ScimSupportedFlag"
        sort:
          $ref: "#/components/schemas/ScimSupportedFlag"
        etag:
          $ref: "#/components/schemas/ScimSupportedFlag"
        authenticationSchemes:
          type: array
          description: Exactly one entry, of type `oauthbearertoken`.
          items:
            type: object
        meta:
          $ref: "#/components/schemas/ScimMeta"
    ScimSupportedFlag:
      type: object
      properties:
        supported:
          type: boolean
