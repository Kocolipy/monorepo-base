spring:
  config:
    # This file shadows the main `application.yaml` entirely, so the session
    # repository type it needs is imported from the same document the deployed
    # service reads rather than copied here. Without it these contexts would wire
    # a session repository that cannot be searched by principal and
    # AccountSessionsAdapter would have nothing to inject.
    import: classpath:session.yaml
  datasource:
    url: jdbc:h2:mem:backend;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop

app:
  auth:
    username: test-user
    password: test-password
    secondary-username: test-admin
    secondary-password: test-admin-password
    lockout:
      max-attempts: 3
      duration: 5m
