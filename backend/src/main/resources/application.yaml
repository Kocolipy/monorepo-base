spring:
  application:
    name: backend
  config:
    # The session repository type and configure-action live in `session.yaml`, so
    # the test resources' `application.yaml` — which shadows this file entirely —
    # can import the same document instead of restating it.
    import: classpath:session.yaml
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/backend}
    username: ${DATABASE_USERNAME:backend}
    password: ${DATABASE_PASSWORD:backend}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 2s
      timeout: 2s
  session:
    # `spring.session.data.redis`, not `spring.session.redis`: Boot 4 moved these
    # keys and the old prefix is deprecated at error level, which means quietly
    # ignored — the namespace and flush mode below only take effect here.
    data:
      redis:
        namespace: backend:session
        flush-mode: on-save

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:15m}
      cookie:
        name: JSESSIONID
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax

app:
  auth:
    username: ${APP_USERNAME:user}
    password: ${APP_PASSWORD:P@ssw0rd}
    secondary-username: ${APP_SECONDARY_USERNAME:admin}
    secondary-password: ${APP_SECONDARY_PASSWORD:P@ssw0rd}
    lockout:
      # Consecutive failures that lock an account, and how long it stays locked.
      max-attempts: ${APP_LOCKOUT_MAX_ATTEMPTS:5}
      duration: ${APP_LOCKOUT_DURATION:20m}
  session:
    # The fixed ceiling on a session's age from creation, independent of the
    # idle timeout above (`server.servlet.session.timeout`), which resets on
    # every request and so never bounds a continuously-active session on its
    # own.
    absolute-lifetime: ${APP_SESSION_ABSOLUTE_LIFETIME:8h}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
