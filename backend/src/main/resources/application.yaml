spring:
  application:
    name: backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/backend}
    username: ${DATABASE_USERNAME:backend}
    password: ${DATABASE_PASSWORD:backend}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 2s
      timeout: 2s
  session:
    # `spring.session.data.redis`, not `spring.session.redis`: Boot 4 moved these
    # keys and the old prefix is deprecated at error level, which means quietly
    # ignored — the namespace and flush mode below only take effect here.
    data:
      redis:
        namespace: backend:session
        # Indexed, not default: the indexed repository is the only one that can
        # be searched by principal, which is what lets disabling an account end
        # the sessions it already holds (AccountSessionsAdapter). Reverting this
        # to `default` removes that bean and the application fails to start.
        repository-type: indexed
        # The indexed repository normally CONFIG SETs `notify-keyspace-events` on
        # startup to learn about expiries. ElastiCache disables the CONFIG
        # command, so leaving that on makes the deployed service fail to start —
        # and nothing about revoking a session needs the events. Expired sessions
        # are reaped by the repository's own cleanup cron instead; set
        # `notify-keyspace-events` in the cache parameter group to get the events
        # as well.
        configure-action: none
        flush-mode: on-save

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:15m}
      cookie:
        name: JSESSIONID
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax

app:
  auth:
    username: ${APP_USERNAME:user}
    password: ${APP_PASSWORD:P@ssw0rd}
    secondary-username: ${APP_SECONDARY_USERNAME:admin}
    secondary-password: ${APP_SECONDARY_PASSWORD:P@ssw0rd}
    lockout:
      # Consecutive failures that lock an account, and how long it stays locked.
      max-attempts: ${APP_LOCKOUT_MAX_ATTEMPTS:3}
      duration: ${APP_LOCKOUT_DURATION:5m}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
