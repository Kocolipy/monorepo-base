spring:
  application:
    name: backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/backend}
    username: ${DATABASE_USERNAME:backend}
    password: ${DATABASE_PASSWORD:backend}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 2s
      timeout: 2s
  session:
    redis:
      namespace: backend:session
      repository-type: default
      flush-mode: on-save

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:15m}
      cookie:
        name: JSESSIONID
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax

app:
  auth:
    username: ${APP_USERNAME:user}
    password: ${APP_PASSWORD:P@ssw0rd}
    email: ${APP_EMAIL:user@example.com}
    secondary-username: ${APP_SECONDARY_USERNAME:admin}
    secondary-password: ${APP_SECONDARY_PASSWORD:P@ssw0rd}
    secondary-email: ${APP_SECONDARY_EMAIL:admin@example.com}
    lockout:
      # Consecutive failures that lock an account, and how long it stays locked.
      max-attempts: ${APP_LOCKOUT_MAX_ATTEMPTS:3}
      duration: ${APP_LOCKOUT_DURATION:5m}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
