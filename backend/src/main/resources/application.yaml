spring:
  application:
    name: backend
  config:
    # The session repository type and configure-action live in `session.yaml`, and
    # the structured log format in `logging.yaml`, so the test resources'
    # `application.yaml` — which shadows this file entirely — can import the same
    # documents instead of restating them.
    import: classpath:session.yaml,classpath:logging.yaml
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/backend}
    username: ${DATABASE_USERNAME:backend}
    password: ${DATABASE_PASSWORD:backend}
    hikari:
      # Every runtime connection assumes `backend_app`, the least-privilege role
      # the V3 migration creates: full DML on the tables the application owns the
      # lifecycle of, and INSERT/SELECT only on `audit_events`. That is what makes
      # the audit trail append-only for THIS application rather than only by
      # convention — an UPDATE or DELETE from application code is refused by the
      # server with SQLSTATE 42501, whatever the code intended.
      #
      # Runs once per physical connection, and SET ROLE is session-scoped, so it
      # holds for every statement that connection ever carries. The retention job
      # is the one exception and arranges it itself, with a transaction-scoped
      # `SET LOCAL ROLE` that reverts on commit.
      connection-init-sql: SET ROLE backend_app
  jpa:
    hibernate:
      # Flyway migrations (src/main/resources/db/migration) are the only source
      # of schema; `validate` fails startup on drift instead of silently
      # generating DDL, which is what `update`/`create*` would do here.
      ddl-auto: validate
    open-in-view: false
  flyway:
    baseline-on-migrate: false
    # Naming a user here is what gives Flyway a connection of its own, outside the
    # Hikari pool and therefore outside the `SET ROLE` above. It has to be outside
    # it: `backend_app` cannot create a table, and the role does not exist at all
    # until the migration that creates it has run — a migration through the pool
    # would fail on its own first connection, before it could create the role that
    # connection was told to assume.
    #
    # The credentials are the same owning login role the datasource connects as;
    # what differs is that this connection keeps its privileges instead of
    # dropping to the runtime role.
    user: ${DATABASE_USERNAME:backend}
    password: ${DATABASE_PASSWORD:backend}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 2s
      timeout: 2s
  session:
    # `spring.session.data.redis`, not `spring.session.redis`: Boot 4 moved these
    # keys and the old prefix is deprecated at error level, which means quietly
    # ignored — the namespace and flush mode below only take effect here.
    data:
      redis:
        namespace: backend:session
        flush-mode: on-save

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:15m}
      cookie:
        name: JSESSIONID
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax

app:
  scim:
    # The release gate. Absent on purpose: the default — closed — belongs to
    # ScimSecurityConfig's @Value expression, so an unset setting reaches the gate
    # as closed and "SCIM is off unless someone turned it on" is a fact about the
    # code rather than about this file, which a deployment may replace wholesale.
    #
    # Override with APP_SCIM_ENABLED=true; see README.md's Configuration section.
    # Users and Groups are one release capability, so this stays closed until the
    # Group half is complete.
  auth:
    username: ${APP_USERNAME:user}
    password: ${APP_PASSWORD:P@ssw0rd}
    secondary-username: ${APP_SECONDARY_USERNAME:admin}
    secondary-password: ${APP_SECONDARY_PASSWORD:P@ssw0rd}
    lockout:
      # Consecutive failures that lock an account, and how long it stays locked.
      max-attempts: ${APP_LOCKOUT_MAX_ATTEMPTS:5}
      duration: ${APP_LOCKOUT_DURATION:20m}
  session:
    # The fixed ceiling on a session's age from creation, independent of the
    # idle timeout above (`server.servlet.session.timeout`), which resets on
    # every request and so never bounds a continuously-active session on its
    # own.
    absolute-lifetime: ${APP_SESSION_ABSOLUTE_LIFETIME:8h}
  audit:
    retention:
      # `period` and `schedule` are deliberately absent, not forgotten. Both
      # defaults — one year, and 03:30 daily — belong to AuditRetentionPolicy,
      # which is also where the 90-day floor is enforced, so writing a default
      # here would be a second copy of a number the domain owns and the two would
      # drift. An unset setting has to reach the policy as unset for "the default
      # is one year" to be a fact about the rule rather than about this file.
      #
      # Override with APP_AUDIT_RETENTION_PERIOD (e.g. 400d) and
      # APP_AUDIT_RETENTION_SCHEDULE; see README.md's Configuration section for
      # the exact default and floor. A value below 90 days fails startup.

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
