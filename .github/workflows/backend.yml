# The backend's baseline gate on every pull request and every push to main.
#
# It runs exactly backend/scripts/verify.sh — the command backend/AGENTS.md names as the gate —
# and adds nothing of its own, so CI and a developer's machine cannot disagree about what
# "green" means. That gate includes the SCIM conformance fixtures and the OpenAPI contract
# check (src/test/java/com/example/backend/contract/), which need Docker for Testcontainers'
# Postgres and Redis; the hosted Ubuntu runner provides it.
name: backend

on:
  pull_request:
    paths:
      - "backend/**"
      - ".tool-versions"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".tool-versions"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The JDK pinned in /.tool-versions; the build's Enforcer still rejects anything
      # outside [25,26).
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version-file: .tool-versions
          cache: maven

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # The same Semgrep release the local gate is run with.
      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check semgrep==1.157.0

      - name: Baseline gate
        run: ./scripts/verify.sh
